<html lang="zh-CN">
<head>

  <title>青石镇 - 小镇地图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
      background: linear-gradient(145deg, #1e2228 0%, #14181c 45%, #0e1114 100%);
      min-height: 100vh;
      overflow-y: auto;
    }
    .map-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .map-header {
      text-align: center;
      margin-bottom: 10px;
    }
    .map-title {
      font-size: 28px;
      color: #c9a227;
      text-shadow: 0 0 12px rgba(201, 162, 39, 0.35);
    }
    .map-subtitle {
      font-size: 14px;
      color: #999;
    }
    .back-btn {
      display: none;
    }
    .leave-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: linear-gradient(145deg, #f44336, #d32f2f);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
    }
    .leave-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
    }
    .gold-display {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 8px 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #c9a227;
      border-radius: 20px;
      color: #f4d03f;
      font-size: 14px;
      font-weight: bold;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(201, 162, 39, 0.25);
    }
    .map-area {
      position: relative;
      width: 800px;
      height: 580px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      border: 2px solid #5d5346;
      overflow: hidden;
      margin: 0 auto;
    }
    .map-area::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(188, 170, 143, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(188, 170, 143, 0.06) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .map-lines {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: visible;
    }
    .map-lines line {
      stroke: #8a7f6e;
      stroke-width: 2;
    }
    .map-lines svg {
      width: 100%;
      height: 100%;
    }

    .map-nodes {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    .location-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .location-node:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }
    .location-node.current .node-inner {
      box-shadow: 0 0 15px rgba(201, 162, 39, 0.55);
      border-color: #c9a227;
      background: linear-gradient(145deg, #4a4540, #353129);
    }
    .location-node.available .node-inner {
      box-shadow: 0 0 8px rgba(201, 162, 39, 0.35);
    }
    .location-node.unavailable {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .location-node.notice-spot .node-inner {
      border-color: #b8860b;
    }
    .location-node.notice-spot .node-name {
      color: #e8c547;
    }
    .node-inner {
      width: 90px;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(145deg, #3a3834, #252320);
      border: 2px solid #5d5346;
      transition: all 0.3s ease;
    }
    .node-icon {
      font-size: 16px;
      margin-bottom: 4px;
    }
    .node-name {
      font-size: 11px;
      color: #fff;
      text-align: center;
    }
    .node-status {
      font-size: 8px;
      color: #999;
    }
    .location-panel {
      background: rgba(24, 26, 30, 0.92);
      border-radius: 12px;
      border: 1px solid #5d5346;
      padding: 20px;
      width: 100%;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .location-icon {
      font-size: 28px;
    }
    .location-name {
      font-size: 22px;
      color: #d4c4a8;
    }
    .location-description {
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }
    
    .town-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #5d5346;
    }
    .town-title {
      color: #c9a227;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .town-tips {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .town-tip-line {

      line-height: 1.55;
      margin: 0;
      padding: 8px 10px;
      background: rgba(60, 56, 48, 0.45);
      border-radius: 8px;
      border-left: 3px solid #8a7a5a;
    }
    .town-chat-btn {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #8a7a5a;
      border-radius: 8px;
      background: linear-gradient(145deg, #4a4238, #353029);
      color: #e8dcc8;
      font-size: 14px;
      cursor: pointer;

    .town-chat-btn:hover {
      border-color: #c9a227;

      border-top: 1px solid #5d5346;
    }

      gap: 10px;
    }
    .npc-interact-btn {

      border: 1px solid #6b6254;
      border-radius: 8px;
      background: linear-gradient(145deg, #3d3830, #2c2822);
      color: #e8dcc8;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .npc-interact-btn:hover {
      border-color: #c9a227;
      color: #fff8ec;
      box-shadow: 0 0 8px rgba(201, 162, 39, 0.2);
    }

    /* 与大地图正阳派侧栏对话区同构（map.css .dialogue-*），嵌入面板而非居中弹窗 */
    .street-story-npc-section,

      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #5d5346;
    }
    .street-story-npc-section .npc-list,
    .gate-guide-npc-section .npc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dialogue-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #5d5346;
    }
    .dialogue-content {
      display: flex;
      flex-direction: column;
    }
    .dialogue-speaker {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .dialogue-npc-icon {
      font-size: 20px;
      margin-right: 8px;
    }
    .dialogue-npc-name {
      font-size: 15px;
      font-weight: bold;
      color: #d4af37;
    }
    .dialogue-text {
      font-size: 15px;
      color: #d8d0c4;
      line-height: 1.6;
      margin-bottom: 12px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.28);
      border-radius: 6px;
      border: 1px solid #4a4338;
      min-height: 3.2em;
    }
    .dialogue-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dialogue-option {
      padding: 8px 15px;
      background: linear-gradient(145deg, #3d3830, #2c2822);
      border: 1px solid #6b6254;
      border-radius: 6px;
      color: #d0c8b8;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dialogue-option:hover {
      border-color: #c9a227;
      color: #fff8ec;
    }
    .dialogue-option.return {
      border-color: #555;
      color: #8a8278;
    }
    .dialogue-option.return:hover {
      border-color: #777;
      color: #b8b0a4;
    }
    .dialogue-option:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

        function qingstoneEnsurePlayerData() {
          if (!window.playerData) {
            window.playerData = {
              inventory: [],
              level: 1,
              equipment: { weapon: null, armor: null, helmet: null, shoes: null, accessory: null }
            };
          }
          if (!window.playerData.inventory) window.playerData.inventory = [];
        }

        function qingstonePersistPlayerData() {
          try {
            if (window.playerData) {
              localStorage.setItem('playerData', JSON.stringify(window.playerData));
            }
          } catch (e) {}
        }

        function qingstoneCountItem(itemId) {
          qingstoneEnsurePlayerData();
          var n = 0;
          window.playerData.inventory.forEach(function (s) {
            if (s.id === itemId) n += s.quantity || 0;
          });
          return n;
        }

        function qingstoneAddInventoryItem(itemId, qty) {
          qingstoneEnsurePlayerData();
          var q = qty || 1;
          var inv = window.playerData.inventory;
          for (var i = 0; i < inv.length; i++) {
            if (inv[i].id === itemId && inv[i].quantity < 99) {
              var can = 99 - inv[i].quantity;
              var add = Math.min(can, q);
              inv[i].quantity += add;
              q -= add;
              if (q <= 0) break;
            }
          }
          while (q > 0) {
            var add2 = Math.min(q, 99);
            inv.push({ id: itemId, quantity: add2 });
            q -= add2;
          }
          qingstonePersistPlayerData();
        }

        /** 教头处银两购武：先入背包秘籍，研读后再入武学；行囊里已有该册则暂不可叠购，读完消耗后可再买 */

          { martialId: 10, itemId: 'skillbook_liuyun', label: '《阵形剑诀》', price: 88 },
          { martialId: 13, itemId: 'skillbook_chenqiao_quan', label: '《沉桥拳诀》', price: 86 },
          { martialId: 14, itemId: 'skillbook_polang_dao', label: '《破浪刀谱》', price: 90 },
          { martialId: 11, itemId: 'skillbook_yangqi_shu', label: '《养气术》', price: 95 },
          { martialId: 12, itemId: 'skillbook_nuobu_jue', label: '《挪步诀》', price: 90 }
        ];

        let qsDialoguePayload = null;
        let qsTypeTimer = null;

        function clearQsTypeTimer() {
          if (qsTypeTimer) {
            clearInterval(qsTypeTimer);
            qsTypeTimer = null;
          }
        }

        function formatQsSpeakerLine(step) {
          if (!step.title) return step.name;
          return step.name + '（' + step.title + '）';
        }

        function getQsTypeText(step) {
          if (step.name === '旁白') return step.body;
          return step.name + '：' + step.body;
        }

        function closeQingstoneDialogueAbandon() {
          clearQsTypeTimer();
          qsDialoguePayload = null;
          const panel = document.getElementById('qingstoneDialoguePanel');
          if (panel) panel.style.display = 'none';
          updatePanel();
        }

        function finishQingstoneDialogueSequence() {
          const fn = qsDialoguePayload && qsDialoguePayload.onComplete;
          clearQsTypeTimer();
          qsDialoguePayload = null;
          const panel = document.getElementById('qingstoneDialoguePanel');
          if (panel) panel.style.display = 'none';

        // 检查升级
        function checkLevelUp(save) {
          console.log('=== checkLevelUp 开始 ===');
          let levelUpCount = 0;
          let finalLevel = save.player.level;
          
          while (true) {
            // 计算当前等级所需的经验（每升一级所需经验增加50%）
            const expNeeded = Math.floor(100 * Math.pow(1.5, save.player.level - 1));
            console.log(`当前等级: ${save.player.level}, 当前阅历: ${save.player.exp}, 升级所需: ${expNeeded}`);
            
            if (save.player.exp >= expNeeded) {
              // 升级
              save.player.exp -= expNeeded;
              save.player.level += 1;
              levelUpCount++;
              console.log(`升级！当前等级: ${save.player.level}, 剩余阅历: ${save.player.exp}`);
            } else {
              break;
            }
          }
          
          // 如果有升级，立即显示飘字提示
          if (levelUpCount > 0) {
            console.log(`恭喜！升级 ${levelUpCount} 级，当前等级: ${save.player.level}`);
            showFloatText(`恭喜！升至 ${save.player.level} 级！`, '#4caf50');
          }
          
          console.log('=== checkLevelUp 结束 ===');
        }

        function applyMainQuestRewardsToSave(questId) {
          if (typeof ALL_TASKS === 'undefined' || !ALL_TASKS.main) return;
          const task = ALL_TASKS.main.find((t) => t.id === questId);
          if (!task || !task.rewards) return;
          const saveData = localStorage.getItem('game_save_0');
          if (!saveData) return;
          try {
            const save = JSON.parse(saveData);
            if (!save.player) return;
            task.rewards.forEach((r) => {
              const v = parseInt(r.value, 10) || 0;
              if (!v) return;
              if (r.type === 'gold') {
                save.player.gold = (save.player.gold || 0) + v;
              } else if (r.type === 'yueli' || r.type === 'exp') {
                save.player.exp = (save.player.exp || 0) + v;
              }
            });
            if (typeof checkLevelUp === 'function') checkLevelUp(save);
            localStorage.setItem('game_save_0', JSON.stringify(save));
            loadGoldFromSave();
          } catch (e) {
            console.warn('applyMainQuestRewardsToSave', e);
          }
        }

        function floatMainQuestRewardChain(questId) {
          if (typeof ALL_TASKS === 'undefined' || !ALL_TASKS.main) return;
          const task = ALL_TASKS.main.find((t) => t.id === questId);
          if (!task || !task.rewards) return;
          const lines = [];
          lines.push([`主线 · 「${task.name}」达成`, '#FFD700']);
          task.rewards.forEach((r) => {
            const v = parseInt(r.value, 10) || 0;
            if (!v) return;
            let color = '#f4d03f';
            const label = `${r.name || '奖励'} +${v}`;
            if (r.type === 'gold') color = '#ff9800';
            else if (r.type === 'exp') color = '#ffeb3b';
            else if (r.type === 'yueli') color = '#9c27b0';
            lines.push([label, color]);
          });
          let idx = 0;
          function next() {
            if (idx >= lines.length) return;
            const pair = lines[idx++];
            runSmallMapBattleRewardFloat(pair[0], pair[1], () => setTimeout(next, 380));
          }
          next();
        }

        function playPostBattleMapRewardFloats() {
          let data = null;
          if (window.BattleSettlement && typeof BattleSettlement.takePostBattleMapRewardFloats === 'function') {

          } else {
            const raw = localStorage.getItem('battle_map_reward_floats');
            if (raw) {
              try {
                data = JSON.parse(raw);
              } catch (e) {
                data = null;
              }
              localStorage.removeItem('battle_map_reward_floats');
            }
          }
          if (!data) return;
          const exp = parseInt(data.exp, 10) || 0;
          const gold = parseInt(data.gold, 10) || 0;
          const expReward = parseInt(data.expReward, 10) || 0;
          const lines = [];
          if (exp > 0) lines.push([`经验 +${exp}`, '#ffeb3b']);
          if (gold > 0) lines.push([`银两 +${gold}`, '#ff9800']);
          if (expReward > 0) lines.push([`阅历 +${expReward}`, '#9c27b0']);
          let idx = 0;
          function next() {
            if (idx >= lines.length) return;
            const pair = lines[idx++];
            runSmallMapBattleRewardFloat(pair[0], pair[1], () => {
              setTimeout(next, 380);
            });
          }
          next();
        }

          updatePanel();

          if (exitBlack && window.BattleSettlement) {
            BattleSettlement.dismissPostBattleMapBlackout(exitBlack, playPostBattleMapRewardFloats);
          } else {
            playPostBattleMapRewardFloats();
          }

          const chatBtn = document.getElementById('townChatBtn');
          if (chatBtn && !chatBtn.dataset.bound) {
            chatBtn.dataset.bound = '1';
            chatBtn.addEventListener('click', randomTownRumor);
          }

          const streetStorySec = document.getElementById('streetStoryNpcSection');
          if (streetStorySec && !streetStorySec.dataset.bound) {
            streetStorySec.dataset.bound = '1';
            streetStorySec.addEventListener('click', (ev) => {
              const btn = ev.target.closest('.npc-interact-btn');
              if (!btn || btn.dataset.npc !== 'street_wang') return;
              startQingstoneEmbeddedDialogue(QINGSTONE_MAIN_B01_STEPS, () => tryCompleteMainB01AfterStreetTalk());
            });
          }

          const gateGuideSec = document.getElementById('gateGuideNpcSection');
          if (gateGuideSec && !gateGuideSec.dataset.bound) {
            gateGuideSec.dataset.bound = '1';
            gateGuideSec.addEventListener('click', (ev) => {
              const btn = ev.target.closest('.npc-interact-btn');
              if (!btn || btn.dataset.npc !== 'gate_guard') return;
              startQingstoneEmbeddedDialogue(QINGSTONE_GATE_GUIDE_STEPS, null);
            });
          }

          bindJiaotouDialogueOptionDelegation();

          const dojoSec = document.getElementById('dojoNpcSection');
          if (dojoSec && !dojoSec.dataset.bound) {
            dojoSec.dataset.bound = '1';
            dojoSec.addEventListener('click', (ev) => {
              const btn = ev.target.closest('.npc-interact-btn');
              if (!btn) return;
              const npc = btn.dataset.npc;
              if (npc === 'jiaotou') {
                if (!isQingstoneMainDone('main_b_01')) {
                  showFloatText('教头一摆手：「连街面都没踩熟，来武馆作甚？先去主街问问人。」', '#d4af37');
                  return;
                }
                openJiaotouBranchMenu();
                return;
              } else if (npc === 'wood_dummy') {
                showFloatText('你在木人儿身上试了两招，木声笃笃，震得虎口微麻。（功能后续开放）', '#bcaaa4');
              }
            });
          }
        }

    function renderMap() {
      const mapNodes = document.getElementById('mapNodes');
      const mapLines = document.querySelector('.map-lines');
      
      mapNodes.innerHTML = '';
      mapLines.innerHTML = `<defs><linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5d4037" /><stop offset="50%" stop-color="#bcaaa4" /><stop offset="100%" stop-color="#5d4037" /></linearGradient></defs>`;

      const current = LOCATIONS[currentLocation];
      const adjacentIds = current.connections;

      CONNECTIONS.forEach(([fromId, toId]) => {
        const from = LOCATIONS[fromId];
        const to = LOCATIONS[toId];
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        line.setAttribute('stroke', 'url(#lineGrad)');
        line.setAttribute('stroke-width', '2'); // 与大地图保持一致的线条粗细
        
        const isConnected = (fromId === currentLocation || toId === currentLocation);
        line.setAttribute('opacity', isConnected ? '1' : '0.5');
        
        mapLines.appendChild(line);
      });

      Object.values(LOCATIONS).forEach(location => {
        const isCurrent = location.id === currentLocation;
        const isAvailable = adjacentIds.includes(location.id);
        const isNotice = location.id === 'town_notice';
        
        const node = document.createElement('div');
        node.className = `location-node ${isCurrent ? 'current' : ''} ${isAvailable ? 'available' : 'unavailable'} ${isNotice ? 'notice-spot' : ''}`;
        node.style.left = `${location.x}px`;
        node.style.top = `${location.y}px`;
        
        node.innerHTML = `
          <div class="node-inner">
            <span class="node-icon">${location.icon}</span>
            <span class="node-name">${location.name}</span>
            <span class="node-status">${isCurrent ? '当前所在' : isAvailable ? '可前往' : '需经相邻'}</span>
          </div>
        `;

        if (isAvailable && !isCurrent) {
          node.addEventListener('click', () => travelTo(location.id));
        }
        
        mapNodes.appendChild(node);
      });
    }

    function travelTo(locationId) {
      currentLocation = locationId;
      renderMap();
      updatePanel();
    }

    /** 读写 playerState（与任务页一致） */
    function readPlayerStateRaw() {
      try {
        const raw = localStorage.getItem('playerState');
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }
    function writePlayerStateRaw(state) {
      localStorage.setItem('playerState', JSON.stringify(state));
    }
    /** 标记主线小节完成；若本次新完成则返回 true */
    function markMainQuestStepComplete(questId) {
      if (!questId) return false;
      const state = readPlayerStateRaw();
      if (!state.activeTasks) state.activeTasks = {};
      const cur = state.activeTasks[questId];
      if (cur && (cur.completed || cur.isCompleted)) return false;
      state.activeTasks[questId] = Object.assign({}, cur, { completed: true, isCompleted: true });
      writePlayerStateRaw(state);
      return true;
    }
    /** 主线小节是否已在存档中标记完成 */
    function isQingstoneMainDone(questId) {
      const state = readPlayerStateRaw();
      const t = state.activeTasks && state.activeTasks[questId];
      return !!(t && (t.completed || t.isCompleted));
    }

    function tryCompleteMainB01AfterStreetTalk() {
      if (markMainQuestStepComplete('main_b_01')) {
        applyMainQuestRewardsToSave('main_b_01');
        floatMainQuestRewardChain('main_b_01');
      }
    }

    function tryCompleteMainB02AfterJiaotouTalk() {
      if (!isQingstoneMainDone('main_b_01')) {
        showFloatText('教头一摆手：「连街面都没踩熟，来武馆作甚？先去主街问问人。」', '#d4af37');
        return;
      }
      if (markMainQuestStepComplete('main_b_02')) {
        applyMainQuestRewardsToSave('main_b_02');
        floatMainQuestRewardChain('main_b_02');
      }
    }

    function refreshGateGuideNpcSection() {
      const sec = document.getElementById('gateGuideNpcSection');
      if (!sec) return;
      if (isQingstoneDialoguePanelOpen()) {
        sec.style.display = 'none';
        return;
      }
      const atGate = currentLocation === 'qingstone_gate';
      const need = atGate && !isQingstoneMainDone('main_b_01');
      sec.style.display = need ? 'block' : 'none';
    }

    function refreshStreetStoryNpcSection() {
      const sec = document.getElementById('streetStoryNpcSection');
      if (!sec) return;
      if (isQingstoneDialoguePanelOpen()) {
        sec.style.display = 'none';
        return;
      }
      const onStreet = currentLocation === 'bluestone_street';
      const need = onStreet && !isQingstoneMainDone('main_b_01');
      sec.style.display = need ? 'block' : 'none';
    }

    function updatePanel() {
      const location = LOCATIONS[currentLocation];
      document.getElementById('locationIcon').textContent = location.icon;
      document.getElementById('locationName').textContent = location.name;
      document.getElementById('locationDesc').textContent = location.desc;

      updateTownTips(currentLocation);

      const dojoNpcSection = document.getElementById('dojoNpcSection');
      if (dojoNpcSection) {
        if (isQingstoneDialoguePanelOpen()) {
          dojoNpcSection.style.display = 'none';
        } else {
          dojoNpcSection.style.display = currentLocation === 'qingstone_dojo' ? 'block' : 'none';
        }
      }

      const leaveBtnContainer = document.getElementById('leaveBtnContainer');
      if (currentLocation === 'qingstone_gate') {
        leaveBtnContainer.innerHTML = '<button class="leave-btn" onclick="goBack()">🚪 离开青石镇</button>';
        leaveBtnContainer.style.display = 'block';
      } else {
        leaveBtnContainer.style.display = 'none';
      }

      refreshGateGuideNpcSection();
      refreshStreetStoryNpcSection();
    }

    const TOWN_TIP_LINES = {
      qingstone_gate: [
        '进出镇的行脚商多在此歇担，有人压低声音谈起「黑风寨」最近的劫道。',
        '石狮底座刻着捐修名录，最旧的一行已经磨得辨认不清。'
      ],
      bluestone_street: [
        '青石板被磨得发亮，雨天也不打滑——老人们说，这是三代人一脚一脚踩出来的。',
        '街角卖馄饨的小贩与挑柴的汉子争路，又笑着互让，镇上日子大抵如此。'
      ],
      town_notice: [
        '新贴的一张榜文墨迹未干，隐约提到「山贼」「悬赏」字样，围观者指指点点。',
        '旧告示层层叠叠，有的被雨水泡烂，只余半句「……勿近蛇窟」。'
      ],
      qingshi_inn: [
        '跑堂的抹布甩得飞起，楼上客房传来剑鞘轻碰栏杆的声响——多半是江湖人。',
        '掌柜拨着算盘，眼角却瞄着门口，谁进来他都先打量鞋底泥色。'
      ],
      li_smithy: [
        '火星溅在淬火桶里，嗤的一声白雾腾起。李师傅哼着小曲，锤声却一下重过一下。',
        '墙角倚着几柄待取的农具，另有半截断剑用布裹着，不知是谁留下的。'
      ],
      qingstone_dojo: [
        '教头正纠正一名学徒的沉肩坠肘，嗓门大得半个街口都能听见。',
        '木人儿上深浅不一的拳印，像是有人在这儿熬过许多个清晨。'
      ],
      renxin_herbal: [
        '药香清苦，混着晒干的艾草气。坐堂大夫正给孩童摸脉，母亲一脸紧张。',
        '柜上小牌写着「义诊半日」，底下又用小字补了「雨雪顺延」。'
      ],
      east_market: [
        '腌菜坛子与粗布堆成小山，卖首饰的摊子支着一块「江南新样」的纸牌，真假难辨。',
        '两个妇人为一文钱争得面红耳赤，旁边卖糖葫芦的汉子看得直乐。'
      ],
      back_lane: [
        '晾衣绳上衫裤飘摇，灶间传出葱油香。谁家孩子在追一只花猫，笑声撞在青砖上。',
        '墙角堆着破箩筐，若有若无的酒气——大概是昨夜有人在此躲风饮酒。'
      ]
    };

    function updateTownTips(locId) {
      const el = document.getElementById('townTips');
      if (!el) return;
      const lines = TOWN_TIP_LINES[locId] || ['此处行人往来，暂无特别消息。'];
      el.innerHTML = lines.map((l) => `<p class="town-tip-line">${l}</p>`).join('');
    }

    const TOWN_RUMORS = [
      '「听说了吗？东市腌菜张的女儿要许给铁匠铺学徒。」',
      '「正阳派的弟子昨儿来镇上打酒，说山里蛇窟不太平。」',
      '「悦来总栈的伙计路过，说天机集市新到了一批胡商货。」',
      '「血刀门的人没进镇，只在道口晃了晃，里正让人盯紧告示墙。」',
      '「后巷王婆的孙子又逃学，被她拎着耳朵往回拽呢。」',
      '「药铺老大夫叹气，说今年暑热伤人，得多备藿香。」'
    ];

    function randomTownRumor() {
      const t = TOWN_RUMORS[Math.floor(Math.random() * TOWN_RUMORS.length)];
      showFloatText(t, '#d4af37');
    }

    function goBack() {
      localStorage.setItem('currentLocation', 'qingstone_town');
      window.location.href = 'map.html';
    }

    init();
  </script>
