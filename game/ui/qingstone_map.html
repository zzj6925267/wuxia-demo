    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
      background: linear-gradient(145deg, #1e2228 0%, #14181c 45%, #0e1114 100%);
      min-height: 100vh;
      overflow-y: auto;
    }
    .map-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .map-header {
      text-align: center;
      margin-bottom: 10px;
    }
    .map-title {
      font-size: 28px;
      color: #c9a227;
      text-shadow: 0 0 12px rgba(201, 162, 39, 0.35);
    }
    .map-subtitle {
      font-size: 14px;
      color: #999;
    }
    .back-btn {
      display: none;
    }
    .leave-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: linear-gradient(145deg, #f44336, #d32f2f);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
    }
    .leave-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
    }
    .gold-display {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      padding: 8px 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #c9a227;
      border-radius: 20px;
      color: #f4d03f;
      font-size: 14px;
      font-weight: bold;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(201, 162, 39, 0.25);
    }
    .map-area {
      position: relative;
      width: 800px;
      max-width: 100%;
      height: 580px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      border: 2px solid #5d5346;
      overflow: hidden;
      margin: 0 auto;
    }
    .map-world {
      position: absolute;
      left: 0;
      top: 0;
      width: 800px;
      height: 580px;
      z-index: 1;
      will-change: transform;
    }
    .map-area::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(188, 170, 143, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(188, 170, 143, 0.06) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .map-lines {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: visible;
    }
    .map-lines line {
      stroke: #8a7f6e;
      stroke-width: 2;
    }
    .map-lines svg {
      width: 100%;
      height: 100%;
    }

    .map-nodes {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    .location-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .location-node:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }
    .location-node.current .node-inner {
      box-shadow: 0 0 15px rgba(201, 162, 39, 0.55);
      border-color: #c9a227;
      background: linear-gradient(145deg, #4a4540, #353129);
    }
    .location-node.available .node-inner {
      box-shadow: 0 0 8px rgba(201, 162, 39, 0.35);
    }
    .location-node.unavailable {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .location-node.notice-spot .node-inner {
      border-color: #b8860b;
    }
    .location-node.notice-spot .node-name {
      color: #e8c547;
    }
    .node-inner {
      width: 90px;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(145deg, #3a3834, #252320);
      border: 2px solid #5d5346;
      transition: all 0.3s ease;
    }
    .node-icon {
      font-size: 16px;
      margin-bottom: 4px;
    }
    .node-name {
      font-size: 11px;
      color: #fff;
      text-align: center;
    }
    .node-status {
      font-size: 8px;
      color: #999;
    }
    .location-panel {
      background: rgba(24, 26, 30, 0.92);
      border-radius: 12px;
      border: 1px solid #5d5346;
      padding: 20px;
      width: 100%;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .location-icon {
      font-size: 28px;
    }
    .location-name {
      font-size: 22px;
      color: #d4c4a8;
    }
    .location-description {
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }
    
    /* 与正阳派 map.html「此地NPC」同构 */
    .npc-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #5d5346;
    }
    .npc-title {
      color: #c9a227;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .npc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .npc-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: linear-gradient(145deg, #3d3830, #2c2822);
      border: 1px solid #6b6254;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .npc-item:hover {
      border-color: #c9a227;
      box-shadow: 0 0 8px rgba(201, 162, 39, 0.25);
      transform: translateY(-1px);
    }
    .npc-icon {
      font-size: 22px;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .npc-item-body {
      min-width: 0;
    }
    .npc-name {
      font-size: 14px;
      font-weight: bold;
      color: #f0e6d3;
    }
    .npc-title-text {
      font-size: 12px;
      color: #a89a88;
      margin-top: 2px;
    }
    .npc-hint {
      padding: 10px 12px;
      font-size: 13px;
      color: #a89a88;
      line-height: 1.55;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid #5d5346;
    }
    .dialogue-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #5d5346;
    }
    .dialogue-content {
      display: flex;
      flex-direction: column;
    }
    .dialogue-speaker {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .dialogue-npc-icon {
      font-size: 20px;
      margin-right: 8px;
    }
    .dialogue-npc-name {
      font-size: 15px;
      font-weight: bold;
      color: #d4af37;
    }
    .dialogue-text {
      font-size: 15px;
      color: #d8d0c4;
      line-height: 1.6;
      margin-bottom: 12px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.28);
      border-radius: 6px;
      border: 1px solid #4a4338;
      min-height: 3.2em;
    }
    .dialogue-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dialogue-option {
      padding: 8px 15px;
      background: linear-gradient(145deg, #3d3830, #2c2822);
      border: 1px solid #6b6254;
      border-radius: 6px;
      color: #d0c8b8;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dialogue-option:hover {
      border-color: #c9a227;
      color: #fff8ec;
    }
    .dialogue-option.return {
      border-color: #555;
      color: #8a8278;
    }
    .dialogue-option.return:hover {
      border-color: #777;
      color: #b8b0a4;
    }
    .dialogue-option:disabled {
      opacity: 0.45;
      cursor: not-allowed;

        function persistQingstoneMapLocation(locId) {
          const id = locId != null ? locId : currentLocation;
          if (!id || !LOCATIONS[id]) return;
          try {
            localStorage.setItem(QINGSTONE_MAP_LOC_KEY, id);
          } catch (e) {}
        }

        function loadQingstoneMapLocation() {
          try {
            const saved = localStorage.getItem(QINGSTONE_MAP_LOC_KEY);
            if (saved && LOCATIONS[saved]) return saved;

          return null;

        function qingstoneEnsurePlayerData() {
          if (!window.playerData) {
            window.playerData = {
              inventory: [],
              level: 1,
              equipment: { weapon: null, armor: null, helmet: null, shoes: null, accessory: null }
            };
          }
          if (!window.playerData.inventory) window.playerData.inventory = [];
        }

        function qingstonePersistPlayerData() {
          try {
            if (window.playerData) {
              localStorage.setItem('playerData', JSON.stringify(window.playerData));
            }
          } catch (e) {}
        }

        function qingstoneCountItem(itemId) {
          qingstoneEnsurePlayerData();
          var n = 0;
          window.playerData.inventory.forEach(function (s) {
            if (s.id === itemId) n += s.quantity || 0;
          });
          return n;
        }

        /** 装备类不可叠放：旧档若 quantity>1 拆成多格（与 inventory.js 一致） */
        function qingstoneSplitStackedEquipment(inv) {
          if (!Array.isArray(inv) || !window.ITEMS) return false;
          var changed = false;
          var i = 0;
          while (i < inv.length) {
            var slot = inv[i];
            if (!slot || !slot.id) {
              i++;
              continue;
            }
            var def = window.ITEMS[slot.id];
            var n = Math.max(1, Math.min(99, parseInt(slot.quantity, 10) || 1));
            if (def && def.category === 'equipment' && n > 1) {
              slot.quantity = 1;
              for (var k = 1; k < n; k++) inv.splice(i + k, 0, { id: slot.id, quantity: 1 });
              changed = true;
              i += n;
            } else {
              i++;
            }
          }
          return changed;
        }

        function qingstoneAddInventoryItem(itemId, qty) {
          qingstoneEnsurePlayerData();
          var q = Math.max(1, parseInt(qty, 10) || 1);
          var def = typeof window !== 'undefined' && window.ITEMS && window.ITEMS[itemId];
          var inv = window.playerData.inventory;
          if (def && def.category === 'equipment') {
            for (var j = 0; j < q; j++) inv.push({ id: itemId, quantity: 1 });
            qingstonePersistPlayerData();
            return;
          }
          for (var i = 0; i < inv.length; i++) {
            if (inv[i].id === itemId && inv[i].quantity < 99) {
              var can = 99 - inv[i].quantity;
              var add = Math.min(can, q);
              inv[i].quantity += add;
              q -= add;
              if (q <= 0) break;
            }
          }
          while (q > 0) {
            var add2 = Math.min(q, 99);
            inv.push({ id: itemId, quantity: add2 });
            q -= add2;
          }
          qingstonePersistPlayerData();
        }

        // 显示飘字提示（带队列防止重叠）
        function showFloatText(text, color) {
          // 添加到队列
          floatTextQueue.push({ text, color });
          
          // 如果没有正在显示的飘字，直接显示
          if (!isShowingFloatText) {
            processFloatTextQueue();
          }
        }
        
        // 处理飘字队列
        function processFloatTextQueue() {
          if (floatTextQueue.length === 0) {
            isShowingFloatText = false;
            return;
          }
          
          isShowingFloatText = true;
          const { text, color } = floatTextQueue.shift();
          
          const floatDiv = document.createElement('div');
          floatDiv.style.position = 'fixed';
          floatDiv.style.top = '50%';
          floatDiv.style.left = '50%';
          floatDiv.style.transform = 'translate(-50%, -50%)';
          floatDiv.style.fontSize = '36px';
          floatDiv.style.fontWeight = 'bold';
          floatDiv.style.color = color || '#f4d03f';
          floatDiv.style.textShadow = '0 0 20px rgba(244, 208, 63, 0.8)';
          floatDiv.style.zIndex = '9999';
          floatDiv.style.opacity = '0';
          floatDiv.style.transition = 'all 0.5s ease';
          floatDiv.textContent = text;
          document.body.appendChild(floatDiv);
          
          setTimeout(() => { floatDiv.style.opacity = '1'; floatDiv.style.transform = 'translate(-50%, -60%)'; }, 50);
          setTimeout(() => { 
            floatDiv.style.opacity = '0'; 
            floatDiv.style.transform = 'translate(-50%, -80%)'; 
          }, 2000);
          setTimeout(() => { 
            document.body.removeChild(floatDiv);
            // 当前飘字显示完，处理下一个
            processFloatTextQueue();
          }, 3000);
        }

    const MAP_WORLD_W = 800;
    const MAP_WORLD_H = 580;
    const MAP_PAN_EDGE_PAD = 12;
    let mapPanInitialized = false;
    let mapPanResizeTimer = null;
    let mapLocationBoundsCache = null;
    let mapPanX = 0;
    let mapPanY = 0;

    function getMapAreaEl() {
      return document.querySelector('.map-area');
    }
    function getMapWorldEl() {
      return document.getElementById('mapWorld');
    }
    function getMapBottomInset() {
      const bar = document.querySelector('.map-area .character-button-area--submap');
      return bar ? bar.offsetHeight : 0;
    }
    function getMapSafeViewportRect() {
      const area = getMapAreaEl();
      if (!area) return null;
      const bottom = getMapBottomInset();
      const pad = MAP_PAN_EDGE_PAD;
      return {
        left: pad,
        top: pad,
        right: area.clientWidth - pad,
        bottom: area.clientHeight - bottom - pad
      };
    }
    function getMapSafeCenter() {
      const safe = getMapSafeViewportRect();
      if (!safe) return { x: MAP_WORLD_W / 2, y: MAP_WORLD_H / 2 };
      return {
        x: (safe.left + safe.right) / 2,
        y: (safe.top + safe.bottom) / 2
      };
    }
    function getMapLocationBounds() {
      if (mapLocationBoundsCache) return mapLocationBoundsCache;
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;
      Object.values(LOCATIONS).forEach(function (loc) {
        minX = Math.min(minX, loc.x);
        maxX = Math.max(maxX, loc.x);
        minY = Math.min(minY, loc.y);
        maxY = Math.max(maxY, loc.y);
      });
      mapLocationBoundsCache = { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
      return mapLocationBoundsCache;
    }
    /** 允许把任意地点居中到安全视口；范围按全部节点坐标推算，而非仅 800×580 贴边 */
    function clampMapPan(x, y) {
      const safe = getMapSafeViewportRect();
      if (!safe) return { x: 0, y: 0 };
      const center = getMapSafeCenter();
      const b = getMapLocationBounds();
      const minPanX = Math.min(0, center.x - b.maxX);
      const maxPanX = Math.max(0, center.x - b.minX);
      const minPanY = Math.min(0, center.y - b.maxY);
      const maxPanY = Math.max(0, center.y - b.minY);
      return {
        x: Math.min(maxPanX, Math.max(minPanX, x)),
        y: Math.min(maxPanY, Math.max(minPanY, y))
      };
    }
    function computeMapPanForLocation(locId) {
      const loc = LOCATIONS[locId];
      if (!loc) return { x: 0, y: 0 };
      const center = getMapSafeCenter();
      return clampMapPan(center.x - loc.x, center.y - loc.y);
    }
    function applyMapPan(x, y, animate) {
      const world = getMapWorldEl();
      if (!world) return;
      mapPanX = x;
      mapPanY = y;
      world.style.transition = animate ? 'transform 0.45s ease' : 'none';
      world.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    }
    function panMapToLocation(locId, opts) {
      opts = opts || {};
      const pan = computeMapPanForLocation(locId);
      const animate = mapPanInitialized && opts.animate !== false;
      if (Math.abs(mapPanX - pan.x) < 1 && Math.abs(mapPanY - pan.y) < 1) return;
      applyMapPan(pan.x, pan.y, animate);
      mapPanInitialized = true;
    }
    function scheduleMapPanToCurrent(opts) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          panMapToLocation(currentLocation, opts);
        });
      });
    }
    window.addEventListener('resize', function () {
      clearTimeout(mapPanResizeTimer);
      mapPanResizeTimer = setTimeout(function () {
        panMapToLocation(currentLocation, { animate: false });
      }, 120);
    });

    function renderMap() {
      const mapNodes = document.getElementById('mapNodes');
      const mapLines = document.querySelector('.map-lines');
      
      mapNodes.innerHTML = '';
      mapLines.innerHTML = `<defs><linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5d4037" /><stop offset="50%" stop-color="#bcaaa4" /><stop offset="100%" stop-color="#5d4037" /></linearGradient></defs>`;

      const current = LOCATIONS[currentLocation];
      const adjacentIds = current.connections;

      CONNECTIONS.forEach(([fromId, toId]) => {
        const from = LOCATIONS[fromId];
        const to = LOCATIONS[toId];
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        line.setAttribute('stroke', 'url(#lineGrad)');
        line.setAttribute('stroke-width', '2'); // 与大地图保持一致的线条粗细
        
        const isConnected = (fromId === currentLocation || toId === currentLocation);
        line.setAttribute('opacity', isConnected ? '1' : '0.5');
        
        mapLines.appendChild(line);
      });

      Object.values(LOCATIONS).forEach(location => {
        const isCurrent = location.id === currentLocation;
        const isAvailable = adjacentIds.includes(location.id);
        const isNotice = location.id === 'town_notice';
        
        const node = document.createElement('div');
        node.className = `location-node ${isCurrent ? 'current' : ''} ${isAvailable ? 'available' : 'unavailable'} ${isNotice ? 'notice-spot' : ''}`;
        node.style.left = `${location.x}px`;
        node.style.top = `${location.y}px`;
        node.dataset.locId = location.id;
        
        node.innerHTML = `
          <div class="node-inner">
            <span class="node-icon">${location.icon}</span>
            <span class="node-name">${location.name}</span>
            <span class="node-status">${isCurrent ? '当前所在' : isAvailable ? '可前往' : '需经相邻'}</span>
          </div>
        `;

        if (isAvailable && !isCurrent) {
          node.addEventListener('click', () => travelTo(location.id));
        }
        
        mapNodes.appendChild(node);
      });
      scheduleMapPanToCurrent({ animate: mapPanInitialized });
    }

      if (locId === 'qingstone_dojo') {
        list.push({ id: 'jiaotou', icon: '🥋', name: '教头', title: '可交谈' });
        list.push({ id: 'wood_dummy', icon: '🪵', name: '木人儿', title: '可交互' });
      }
      if (locId === 'renxin_herbal') {
        list.push({ id: 'he_xingzhou', icon: '🧓', name: '贺行舟', title: '坐堂掌柜 · 可交谈' });
      }
      if (locId === 'li_smithy') {
        list.push({ id: 'li_smith', icon: '🔨', name: '李师傅', title: '掌柜 · 可购兵刃' });
        list.push({ id: 'smith_helper', icon: '👷', name: '学徒', title: '可搭话' });
      }
      const greeter = QINGSTONE_LOCATION_GREETERS[locId];
      if (greeter) {
        list.push({
          id: greeter.id,
          icon: greeter.icon,
          name: greeter.name,
          title: greeter.title
        });
      }
      return list;
    }

    function getQingstoneLocationNpcs(locId) {
      const base = getQingstoneBaseLocationNpcs(locId);
      const extra =
        window.QingstoneCompanionQuest && typeof QingstoneCompanionQuest.getLocationNpcs === 'function'
          ? QingstoneCompanionQuest.getLocationNpcs(locId)
          : [];
      const seen = {};
      const merged = base.concat(extra);
      return merged.filter(function (npc) {
        if (!npc || !npc.id || seen[npc.id]) return false;
        seen[npc.id] = true;
        return true;
      });
    }

    function escapeQsNpcHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function refreshQingstoneNpcHub() {
      const section = document.getElementById('qingstoneNpcSection');
      const listEl = document.getElementById('qingstoneNpcList');
      if (!section || !listEl) return;
      if (isQingstoneDialoguePanelOpen()) {
        section.style.display = 'none';
        return;
      }
      section.style.display = 'block';
      const npcs = getQingstoneLocationNpcs(currentLocation);
      if (!npcs.length) {
        listEl.innerHTML =
          '<div class="npc-hint">此处暂无可对话之人。可点击上方地图中<strong style="color:#e8d89a;">相邻可前往</strong>的地点继续探索。</div>';
        return;
      }
      listEl.innerHTML = npcs
        .map(function (npc) {
          return (
            '<div class="npc-item" data-npc-id="' +
            escapeQsNpcHtml(npc.id) +
            '" role="button" tabindex="0">' +
            '<span class="npc-icon">' +
            (npc.icon || '👤') +
            '</span>' +
            '<div class="npc-item-body">' +
            '<div class="npc-name">' +
            escapeQsNpcHtml(npc.name) +
            '</div>' +
            '<div class="npc-title-text">' +
            escapeQsNpcHtml(npc.title || '') +
            '</div>' +
            '</div>' +
            '</div>'
          );
        })
        .join('');
    }

    function handleQingstoneNpcClick(npcId) {
      if (npcId === 'jiaotou') {
        if (!isQingstoneMainDone('main_b_01')) {
          showFloatText('教头一摆手：「连街面都没踩熟，来武馆作甚？先去主街问问人。」', '#d4af37');
          return;
        }
        openJiaotouBranchMenu();
        return;
      }
      if (npcId === 'li_smith') {
        openSmithBranchMenu();
        return;
      }
      if (
        window.QingstoneCompanionQuest &&
        typeof QingstoneCompanionQuest.handleNpcClick === 'function' &&
        QingstoneCompanionQuest.handleNpcClick(npcId)
      ) {
        return;
      }
      if (QINGSTONE_NPC_PROFILES[npcId]) {
        openQingstoneNpcMenu(npcId);
      }
    }

    function updatePanel() {
      const location = LOCATIONS[currentLocation];
      document.getElementById('locationIcon').textContent = location.icon;
      document.getElementById('locationName').textContent = location.name;
      let desc = location.desc;
      if (
        window.QingstoneCompanionQuest &&
        typeof QingstoneCompanionQuest.getLocationDescExtra === 'function'
      ) {
        desc += QingstoneCompanionQuest.getLocationDescExtra(currentLocation);
      }
      document.getElementById('locationDesc').textContent = desc;

      const leaveBtnContainer = document.getElementById('leaveBtnContainer');
      if (currentLocation === 'qingstone_gate') {
        leaveBtnContainer.innerHTML = '<button class="leave-btn" onclick="goBack()">🚪 离开青石镇</button>';
        leaveBtnContainer.style.display = 'block';
      } else {
        leaveBtnContainer.style.display = 'none';
      }

      refreshQingstoneNpcHub();
    }

    function goBack() {
      localStorage.setItem('currentLocation', 'qingstone_town');
      window.location.href = 'map.html';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
