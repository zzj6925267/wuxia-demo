<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青苍山麓 - 山林地图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
      background: linear-gradient(135deg, #1a2f1a 0%, #0f1f0f 50%, #0a150a 100%);
      min-height: 100vh;
      overflow-y: auto;
    }
    .map-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .map-header {
      text-align: center;
      margin-bottom: 10px;
    }
    .map-title {
      font-size: 28px;
      color: #4CAF50;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    }
    .map-subtitle {
      font-size: 14px;
      color: #999;
    }
    .back-btn {
      display: none;
    }
    .leave-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: linear-gradient(145deg, #f44336, #d32f2f);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
    }
    .leave-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
    }
    .gold-display {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 8px 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #c9a227;
      border-radius: 20px;
      color: #f4d03f;
      font-size: 14px;
      font-weight: bold;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }
    .map-area {
      position: relative;
      width: 100%;
      height: 580px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      border: 2px solid #2E7D32;
      overflow: hidden;
    }
    .map-area::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(76, 175, 80, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(76, 175, 80, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .map-lines {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .map-lines line {
      stroke: #4CAF50;
      stroke-width: 2;
    }
    .map-nodes {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    .location-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .location-node:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }
    .location-node.current .node-inner {
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
      border-color: #4CAF50;
      background: linear-gradient(145deg, #388e3c, #2e7d32);
    }
    .location-node.available .node-inner {
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
    }
    .location-node.unavailable {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .location-node.dungeon .node-inner {
      border-color: #FF9800;
    }
    .location-node.dungeon .node-name {
      color: #FF9800;
    }
    .node-inner {
      width: 90px;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(145deg, #2d442d, #1a2e1a);
      border: 2px solid #2E7D32;
      transition: all 0.3s ease;
    }
    .node-icon {
      font-size: 16px;
      margin-bottom: 4px;
    }
    .node-name {
      font-size: 11px;
      color: #fff;
      text-align: center;
    }
    .node-status {
      font-size: 8px;
      color: #999;
    }
    .location-panel {
      background: rgba(26, 46, 26, 0.9);
      border-radius: 12px;
      border: 1px solid #2E7D32;
      padding: 20px;
      width: 100%;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .location-icon {
      font-size: 28px;
    }
    .location-name {
      font-size: 22px;
      color: #4CAF50;
    }
    .location-description {
      font-size: 14px;
      color: #aaa;
      line-height: 1.6;
    }
    
    .enemy-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #2e7d32;
    }
    
    .enemy-title {
      color: #4caf50;
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .enemy-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .enemy-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: rgba(46, 125, 50, 0.2);
      border: 1px solid #2e7d32;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .enemy-item:hover {
      background: rgba(46, 125, 50, 0.4);
      transform: translateX(5px);
    }
    
    .enemy-icon {
      font-size: 28px;
    }
    
    .enemy-info {
      flex: 1;
    }
    
    .enemy-name {
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }
    
    .enemy-level {
      color: #ff9800;
      font-size: 12px;
    }
    
    .enemy-stats {
      color: #aaa;
      font-size: 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="map-container">
    <div class="map-header">
      <button class="back-btn" onclick="goBack()">← 返回大地图</button>
      <h1 class="map-title">青苍山麓</h1>
      <p class="map-subtitle">山林地图</p>
    </div>

    <div class="map-area">
      <div class="gold-display" id="goldDisplay">💰 银两：<span id="goldValue">0</span></div>
      <svg class="map-lines" viewBox="0 0 1000 580">
        <defs>
          <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2E7D32" />
            <stop offset="50%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#2E7D32" />
          </linearGradient>
        </defs>
      </svg>
      <div class="map-nodes" id="mapNodes"></div>
    </div>

    <div class="location-panel" id="locationPanel">
      <div class="panel-header">
        <span class="location-icon" id="locationIcon">🚪</span>
        <h2 class="location-name" id="locationName">青苍山道口</h2>
      </div>
      <p class="location-description" id="locationDesc">通往青苍山的土路入口，两旁长满齐腰的杂草，林间偶有鸟鸣，越往深处越显昏暗。路边立着半块残破石碑，刻着「山林凶险，独行慎入」。</p>
      
      <div class="enemy-section" id="enemySection" style="display: none;">
        <h3 class="enemy-title">⚔️ 此处敌人</h3>
        <div class="enemy-list" id="enemyList"></div>
      </div>
      
      <div id="leaveBtnContainer" style="display: none;"></div>
    </div>
  </div>

  <script src="../js/data/enemies.js"></script>
  <script src="forestMapData.js"></script>
  <script>
        const LOCATIONS = window.FOREST_LOCATIONS;
        const CONNECTIONS = window.FOREST_CONNECTIONS;

        let currentLocation = 'qingcang_entrance';

        // 更新银两显示
        function updateGoldDisplay(gold) {
          const goldEl = document.getElementById('goldValue');
          if (goldEl) {
            goldEl.textContent = gold;
          }
        }

        // 显示飘字提示
        function showFloatText(text, color) {
          const floatDiv = document.createElement('div');
          floatDiv.style.position = 'fixed';
          floatDiv.style.top = '50%';
          floatDiv.style.left = '50%';
          floatDiv.style.transform = 'translate(-50%, -50%)';
          floatDiv.style.fontSize = '36px';
          floatDiv.style.fontWeight = 'bold';
          floatDiv.style.color = color || '#f4d03f';
          floatDiv.style.textShadow = '0 0 20px rgba(244, 208, 63, 0.8)';
          floatDiv.style.zIndex = '9999';
          floatDiv.style.opacity = '0';
          floatDiv.style.transition = 'all 0.5s ease';
          floatDiv.textContent = text;
          document.body.appendChild(floatDiv);
          
          setTimeout(() => { floatDiv.style.opacity = '1'; floatDiv.style.transform = 'translate(-50%, -60%)'; }, 50);
          setTimeout(() => { floatDiv.style.opacity = '0'; floatDiv.style.transform = 'translate(-50%, -80%)'; }, 2000);
          setTimeout(() => { document.body.removeChild(floatDiv); }, 3000);
        }

        // 检查升级
        function checkLevelUp(save) {
          console.log('=== checkLevelUp 开始 ===');
          let levelUpCount = 0;
          let finalLevel = save.player.level;
          
          while (true) {
            // 计算当前等级所需的经验（每升一级所需经验增加50%）
            const expNeeded = Math.floor(100 * Math.pow(1.5, save.player.level - 1));
            console.log(`当前等级: ${save.player.level}, 当前阅历: ${save.player.exp}, 升级所需: ${expNeeded}`);
            
            if (save.player.exp >= expNeeded) {
              // 升级
              save.player.exp -= expNeeded;
              save.player.level += 1;
              levelUpCount++;
              console.log(`升级！当前等级: ${save.player.level}, 剩余阅历: ${save.player.exp}`);
            } else {
              break;
            }
          }
          
          // 如果有升级，立即显示飘字提示
          if (levelUpCount > 0) {
            console.log(`恭喜！升级 ${levelUpCount} 级，当前等级: ${save.player.level}`);
            showFloatText(`恭喜！升至 ${save.player.level} 级！`, '#4caf50');
          }
          
          console.log('=== checkLevelUp 结束 ===');
        }

        // 从存档读取银两并更新显示
        function loadGoldFromSave() {
          const saveData = localStorage.getItem('game_save_0');
          if (saveData) {
            try {
              const save = JSON.parse(saveData);
              const gold = save.player ? (save.player.gold || 0) : 0;
              updateGoldDisplay(gold);
            } catch (e) {
              console.error('读取银两失败:', e);
            }
          }
        }

        // 处理待处理的战斗奖励
        function applyPendingBattleRewards() {
          console.log('=== applyPendingBattleRewards 开始 ===');
          const pendingData = localStorage.getItem('pending_battle_rewards');
          console.log('pending_battle_rewards:', pendingData);
          if (!pendingData) {
            console.log('没有待处理的战斗奖励');
            return;
          }

          try {
            const rewards = JSON.parse(pendingData);
            console.log('应用战斗奖励:', rewards);

            // 读取存档
            let saveData = localStorage.getItem('game_save_0');
            console.log('存档数据:', saveData ? '存在' : '不存在');
            
            let save;
            if (!saveData) {
              // 如果没有存档，创建一个初始存档
              console.log('没有存档数据，创建初始存档');
              save = {
                player: {
                  id: 'player',
                  name: '少侠',
                  level: 1,
                  exp: 0,
                  expToNextLevel: 100,
                  maxHp: 100,
                  hp: 100,
                  maxMp: 50,
                  mp: 50,
                  attack: 10,
                  defense: 5,
                  skills: ['basic_attack', 'healing_palm'],
                  inventory: [{ id: 'potion_small', quantity: 3 }],
                  stats: {
                    strength: 10,
                    agility: 10,
                    vitality: 10,
                    spirit: 10
                  },
                  gold: 50,
                  flags: {}
                },
                timestamp: Date.now(),
                version: '1.0.0'
              };
            } else {
              save = JSON.parse(saveData);
            }

            // 如果是第一次创建存档，使用角色面板的默认初始数据
            // 或者如果存档中的阅历是0，说明是旧的初始存档，需要更新
            if (!saveData || save.player.exp === 0) {
              // 这些是角色面板的默认初始数据
              save.player.exp = 45;  // 默认阅历
              save.player.gold = save.player.gold || 0;   // 保留已有的银两
              save.player.level = 10; // 默认等级
              save.player.power = 580; // 默认战力
              console.log('使用默认角色数据初始化/更新存档:', save.player);
            }

            console.log('存档解析后的数据:', save);
            console.log('存档中的 player.gold:', save.player?.gold);
            console.log('存档中的 player.exp:', save.player?.exp);

            // 应用银两奖励（转换为数字）
            const goldReward = parseInt(rewards.gold) || 0;
            if (goldReward > 0) {
              if (!save.player.gold) save.player.gold = 0;
              save.player.gold += goldReward;
              console.log(`银两 +${goldReward}, 当前: ${save.player.gold}`);
              // 更新银两显示
              updateGoldDisplay(save.player.gold);
            } else {
              console.log('没有银两奖励或奖励为0');
            }

            // 应用阅历奖励（转换为数字）
            const expReward = parseInt(rewards.exp) || 0;
            if (expReward > 0) {
              if (!save.player.exp) save.player.exp = 0;
              save.player.exp += expReward;
              console.log(`阅历 +${expReward}, 当前: ${save.player.exp}`);
              
              // 检查是否需要升级
              checkLevelUp(save);
            } else {
              console.log('没有阅历奖励或奖励为0');
            }

            // 保存存档
            localStorage.setItem('game_save_0', JSON.stringify(save));
            console.log('存档已更新，保存的数据:', localStorage.getItem('game_save_0'));

            // 清除待处理奖励
            localStorage.removeItem('pending_battle_rewards');
            console.log('战斗奖励已应用');
          } catch (error) {
            console.error('应用战斗奖励失败:', error);
          }
          console.log('=== applyPendingBattleRewards 结束 ===');
        }

        function init() {
          // 首先处理战斗奖励
          applyPendingBattleRewards();
          
          // 加载银两显示
          loadGoldFromSave();
          
          // 检查是否有战斗前的位置，如果有则返回原地
          const preBattleLoc = localStorage.getItem('preBattleLocation');
          if (preBattleLoc && LOCATIONS[preBattleLoc]) {
            currentLocation = preBattleLoc;
            localStorage.removeItem('preBattleLocation');
          }
          
          renderMap();
          updatePanel();
        }

    function renderMap() {
      const mapNodes = document.getElementById('mapNodes');
      const mapLines = document.querySelector('.map-lines');
      
      mapNodes.innerHTML = '';
      mapLines.innerHTML = `<defs><linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2E7D32" /><stop offset="50%" stop-color="#4CAF50" /><stop offset="100%" stop-color="#2E7D32" /></linearGradient></defs>`;

      const current = LOCATIONS[currentLocation];
      const adjacentIds = current.connections;

      CONNECTIONS.forEach(([fromId, toId]) => {
        const from = LOCATIONS[fromId];
        const to = LOCATIONS[toId];
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);
        line.setAttribute('stroke', 'url(#lineGrad)');
        line.setAttribute('stroke-width', '2');
        
        const isConnected = (fromId === currentLocation || toId === currentLocation);
        line.setAttribute('opacity', isConnected ? '1' : '0.5');
        
        mapLines.appendChild(line);
      });

      Object.values(LOCATIONS).forEach(location => {
        const isCurrent = location.id === currentLocation;
        const isAvailable = adjacentIds.includes(location.id);
        const isDungeon = location.id === 'heifeng_entrance';
        
        const node = document.createElement('div');
        node.className = `location-node ${isCurrent ? 'current' : ''} ${isAvailable ? 'available' : 'unavailable'} ${isDungeon ? 'dungeon' : ''}`;
        node.style.left = `${location.x}px`;
        node.style.top = `${location.y}px`;
        
        node.innerHTML = `
          <div class="node-inner">
            <span class="node-icon">${location.icon}</span>
            <span class="node-name">${location.name}</span>
            <span class="node-status">${isCurrent ? '当前所在' : isAvailable ? '可前往' : '需经相邻'}</span>
          </div>
        `;

        if (isAvailable && !isCurrent) {
          node.addEventListener('click', () => travelTo(location.id));
        }
        
        mapNodes.appendChild(node);
      });
    }

    function travelTo(locationId) {
      currentLocation = locationId;
      renderMap();
      updatePanel();
    }

    function updatePanel() {
      const location = LOCATIONS[currentLocation];
      document.getElementById('locationIcon').textContent = location.icon;
      document.getElementById('locationName').textContent = location.name;
      document.getElementById('locationDesc').textContent = location.desc;
      
      // 检查是否是青苍山道口，如果是，显示离开按钮
      const leaveBtnContainer = document.getElementById('leaveBtnContainer');
      if (currentLocation === 'qingcang_entrance') {
        leaveBtnContainer.innerHTML = '<button class="leave-btn" onclick="goBack()">🚪 离开此地</button>';
        leaveBtnContainer.style.display = 'block';
      } else {
        leaveBtnContainer.style.display = 'none';
      }
      
      updateEnemyList();
    }

function updateEnemyList() {
  const enemies = getEnemiesAtLocation(currentLocation);
  const enemySection = document.getElementById('enemySection');
  const enemyList = document.getElementById('enemyList');
  
  if (enemies.length > 0) {
    enemySection.style.display = 'block';
    enemyList.innerHTML = enemies.map(enemy => `
      <div class="enemy-item" onclick="startBattle('${enemy.id}')">
        <span class="enemy-icon">${enemy.icon}</span>
        <div class="enemy-info">
          <div>
            <span class="enemy-name">${enemy.name}</span>
            <span class="enemy-level">Lv.${enemy.level}</span>
          </div>
        </div>
      </div>
    `).join('');
  } else {
    enemySection.style.display = 'none';
  }
}

function startBattle(enemyId) {
  localStorage.setItem('battleEnemyId', enemyId);
  // 保存战斗前的位置，战斗结束后返回原地
  localStorage.setItem('preBattleLocation', currentLocation);
  window.location.href = 'battle.html';
}

    function goBack() {
      // 保存当前位置到 localStorage，让大地图知道应该显示哪个地点
      // 返回山林本身的位置，而不是连接的地点
      localStorage.setItem('currentLocation', 'forest');
      window.location.href = 'map.html';
    }

    init();
  </script>
</body>
</html>
