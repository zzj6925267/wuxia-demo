<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战斗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #1a1a1a;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    .battle-container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      max-height: 900px;
      background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    .battle-header {
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #ff9800;
      border-bottom: 1px solid #333;
    }
    
    .battle-field {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
    }
    
    .team-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .team-left {
      align-items: flex-start;
    }
    
    .team-right {
      align-items: flex-end;
    }
    
    .character-card {
      width: 100%;
      max-width: 200px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #333;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.3s ease;
    }
    
    .character-card.active {
      border-color: #4caf50;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    }
    
    .character-card.dead {
      opacity: 0.4;
      filter: grayscale(100%);
    }
    
    .character-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .character-icon {
      font-size: 36px;
    }
    
    .character-info {
      flex: 1;
    }
    
    .character-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    
    .character-level {
      font-size: 12px;
      color: #ff9800;
    }
    
    .hp-bar-container {
      width: 100%;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }
    
    .hp-bar {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      transition: width 0.3s ease;
      border-radius: 6px;
    }
    
    .hp-text {
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }
    
    .battle-log {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }
    
    .battle-log-text {
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 20px #000;
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .battle-log-text.show {
      opacity: 1;
    }
    
    .damage-number {
      position: absolute;
      font-size: 32px;
      font-weight: bold;
      color: #ff5722;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 200;
    }
    
    .damage-number.critical {
      font-size: 40px;
      color: #ffeb3b;
    }
    
    .damage-number.miss {
      color: #9e9e9e;
    }
    
    .damage-number.parry {
      color: #2196f3;
    }
    
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px);
      }
    }
    
    .battle-footer {
      padding: 20px;
      border-top: 1px solid #333;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    
    .battle-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-auto {
      background: linear-gradient(135deg, #4caf50, #388e3c);
      color: #fff;
    }
    
    .btn-auto:hover {
      transform: scale(1.05);
    }
    
    .settle-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 30px;
    }
    
    .settle-panel.show {
      display: flex;
    }
    
    .settle-title {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    
    .settle-title.victory {
      color: #4caf50;
    }
    
    .settle-title.defeat {
      color: #f44336;
    }
    
    .settle-content {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }
    
    .settle-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #333;
      font-size: 18px;
    }
    
    .settle-item:last-child {
      border-bottom: none;
    }
    
    .settle-label {
      color: #aaa;
    }
    
    .settle-value {
      color: #ff9800;
      font-weight: bold;
    }
    
    .btn-exit {
      margin-top: 30px;
      padding: 15px 50px;
      font-size: 20px;
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .btn-exit:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="battle-container">
    <div class="battle-header">
      ⚔️ 战斗中
    </div>
    
    <div class="battle-field">
      <div class="team-side team-left" id="teamAlly">
      </div>
      
      <div class="team-side team-right" id="teamEnemy">
      </div>
    </div>
    
    <div class="battle-log">
      <div class="battle-log-text" id="battleLog"></div>
    </div>
    
    <div class="battle-footer">
      <button class="battle-btn btn-auto" id="btnAuto">自动战斗</button>
    </div>
    
    <div class="settle-panel" id="settlePanel">
      <div class="settle-title" id="settleTitle">胜利</div>
      <div class="settle-content" id="settleContent">
      </div>
      <button class="btn-exit" id="btnExit">离开战斗</button>
    </div>
  </div>

  <script src="battle.js"></script>
</body>
</html>
