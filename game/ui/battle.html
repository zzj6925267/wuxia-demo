<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战斗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      background: #1a1a1a;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    
    .battle-container {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      max-height: 900px;
      background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    .battle-header {
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #ff9800;
      border-bottom: 1px solid #333;
      position: relative;
    }
    
    .turn-display {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid #ff9800;
    }
    
    .battle-field {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
    }
    
    .team-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 50px;
    }
    
    .team-left {
      align-items: flex-start;
    }
    
    .team-right {
      align-items: flex-end;
    }
    
    .character-card {
      width: 100%;
      max-width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .character-card.active {
      transform: scale(1.1);
    }
    
    .character-card.dead {
      opacity: 0.4;
      filter: grayscale(100%);
    }
    
    .character-avatar-container {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .character-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }
    
    .character-avatar-emoji {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #3d2914 0%, #2a1f14 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      color: #d4c4a8;
    }
    
    .character-name {
      font-size: 14px;
      font-weight: bold;
      color: #d4c4a8;
      text-align: center;
      width: 80px;
      white-space: nowrap;
    }
    
    .character-card:nth-child(1) .character-name {
      margin-right: 15px;
    }
    
    .team-right .character-name {
      padding-left: 10px;
    }
    
    .team-left .character-card.attack-move {
      animation: attackMoveRightOnly 0.3s ease-out forwards;
    }
    
    .team-left .character-card.attack-return {
      animation: attackReturnRight 0.3s ease-in forwards;
    }
    
    .team-right .character-card.attack-move {
      animation: attackMoveLeftOnly 0.3s ease-out forwards;
    }
    
    .team-right .character-card.attack-return {
      animation: attackReturnLeft 0.3s ease-in forwards;
    }
    
    .team-left .character-card.dodging {
      animation: dodgeMoveLeft 0.3s ease-out;
    }
    
    .team-right .character-card.dodging {
      animation: dodgeMoveRight 0.3s ease-out;
    }
    
    @keyframes attackMoveRightOnly {
      0% { transform: translateX(0); }
      100% { transform: translateX(220px) scale(1.1); }
    }
    
    @keyframes attackReturnRight {
      0% { transform: translateX(220px) scale(1.1); }
      100% { transform: translateX(0); }
    }
    
    @keyframes attackMoveLeftOnly {
      0% { transform: translateX(0); }
      100% { transform: translateX(-220px) scale(1.1); }
    }
    
    @keyframes attackReturnLeft {
      0% { transform: translateX(-220px) scale(1.1); }
      100% { transform: translateX(0); }
    }
    
    @keyframes dodgeMoveLeft {
      0% { transform: translateX(0) scale(1); }
      50% { transform: translateX(-30px) scale(0.9); }
      100% { transform: translateX(0) scale(1); }
    }
    
    @keyframes dodgeMoveRight {
      0% { transform: translateX(0) scale(1); }
      50% { transform: translateX(30px) scale(0.9); }
      100% { transform: translateX(0) scale(1); }
    }
    
    .hp-text {
      font-size: 12px;
      color: #4caf50;
      text-align: center;
      font-weight: bold;
    }
    
    .mp-text {
      font-size: 12px;
      color: #2196f3;
      text-align: center;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .skill-bubble {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #333;
      padding: 10px 18px;
      border-radius: 20px 25px 22px 28px;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
      border: 2px solid #333;
    }
    
    /* 直刺特效 - 直线剑气 */
    .sword-effect-thrust {
      position: absolute;
      width: 200px;
      height: 8px;
      background: linear-gradient(90deg, transparent, #ffd700, #ff8c00, transparent);
      border-radius: 4px;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transform-origin: left center;
    }
    
    .sword-effect-thrust.show {
      animation: thrustEffect 0.5s ease-out forwards;
    }
    
    @keyframes thrustEffect {
      0% {
        opacity: 0;
        transform: scaleX(0);
      }
      20% {
        opacity: 1;
        transform: scaleX(1);
      }
      100% {
        opacity: 0;
        transform: scaleX(1);
      }
    }
    
    /* 剑影特效 - 竖着的剑气 */
    .sword-effect-shadow {
      position: absolute;
      width: 8px;
      height: 150px;
      background: linear-gradient(180deg, transparent, #8b00ff, #ff00ff, transparent);
      border-radius: 4px;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 20px #8b00ff;
    }
    
    .sword-effect-shadow.show {
      animation: shadowEffect 0.5s ease-out forwards;
    }
    
    @keyframes shadowEffect {
      0% {
        opacity: 0;
        transform: scaleY(0);
      }
      30% {
        opacity: 1;
        transform: scaleY(1);
      }
      100% {
        opacity: 0;
        transform: scaleY(1.5);
      }
    }
    
    /* 受击震动效果 */
    .character-card.hit {
      animation: hitShake 0.3s ease-out;
    }
    
    @keyframes hitShake {
      0%, 100% {
        transform: translateX(0);
      }
      10%, 30%, 50%, 70%, 90% {
        transform: translateX(-8px);
      }
      20%, 40%, 60%, 80% {
        transform: translateX(8px);
      }
    }
    
    .skill-bubble.show {
      opacity: 1;
      top: -60px;
      animation: bubblePop 0.5s ease-out;
    }
    
    .skill-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 45%;
      transform: translateX(-50%) rotate(15deg);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 14px solid #fff;
    }
    
    .skill-bubble::before {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 45%;
      transform: translateX(-50%) rotate(15deg);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 16px solid #333;
      z-index: -1;
    }
    
    @keyframes bubblePop {
      0% {
        transform: translateX(-50%) scale(0.5) rotate(-3deg);
        opacity: 0;
      }
      50% {
        transform: translateX(-50%) scale(1.1) rotate(2deg);
        opacity: 1;
      }
      100% {
        transform: translateX(-50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    
    .battle-log {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 100;
    }
    
    .battle-log-text {
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 20px #000;
      opacity: 0;
      transition: all 0.3s ease;
    }
    
    .battle-log-text.show {
      opacity: 1;
    }
    
    .damage-number {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      color: #ff5722;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 9999;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    
    .damage-number.critical {
      font-size: 30px;
      color: #ffeb3b;
    }
    
    .damage-number.miss {
      color: #9e9e9e;
    }
    
    .damage-number.parry {
      color: #2196f3;
    }
    
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-60px);
      }
    }
    
    .reward-text {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      color: #4caf50;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      opacity: 0;
      z-index: 200;
    }
    
    .reward-text.show {
      animation: rewardFloat 2s ease-out forwards;
    }
    
    @keyframes rewardFloat {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.8);
      }
      15% {
        opacity: 1;
        transform: translateY(0) scale(1.1);
      }
      25% {
        transform: translateY(0) scale(1);
      }
      75% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-40px);
      }
    }
    
    .victory-text {
      color: #ffeb3b;
    }
    
    .battle-footer {
      padding: 20px;
      border-top: 1px solid #333;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    
    .battle-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-auto {
      background: linear-gradient(135deg, #4caf50, #388e3c);
      color: #fff;
    }
    
    .btn-auto:hover {
      transform: scale(1.05);
    }
    
    .settle-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 30px;
    }
    
    .settle-panel.show {
      display: flex;
    }
    
    .settle-title {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    
    .settle-title.victory {
      color: #4caf50;
    }
    
    .settle-title.defeat {
      color: #f44336;
    }
    
    .settle-content {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }
    
    .settle-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #333;
      font-size: 18px;
    }
    
    .settle-item:last-child {
      border-bottom: none;
    }
    
    .settle-label {
      color: #aaa;
    }
    
    .settle-value {
      color: #ff9800;
      font-weight: bold;
    }
    
    .btn-exit {
      margin-top: 30px;
      padding: 15px 50px;
      font-size: 20px;
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .btn-exit:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="battle-container">
    <div class="battle-header">
      ⚔️ 战斗中
      <div class="turn-display" id="turnDisplay">第 1/99 回合</div>
    </div>
    
    <div class="battle-field">
      <div class="team-side team-left" id="teamAlly">
      </div>
      
      <div class="team-side team-right" id="teamEnemy">
      </div>
    </div>
    
    <div class="battle-log">
      <div class="battle-log-text" id="battleLog"></div>
    </div>
    
    <div class="battle-footer">
      <button class="battle-btn btn-auto" id="btnAuto">自动战斗</button>
    </div>
    
    <div class="settle-panel" id="settlePanel">
      <div class="settle-title" id="settleTitle">胜利</div>
      <div class="settle-content" id="settleContent">
      </div>
      <button class="btn-exit" id="btnExit">离开战斗</button>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils/statCalculator.js"></script>
  <script src="../js/utils/effects.js"></script>
  <script src="character.js"></script>
  <script src="../js/data/enemies.js"></script>
  <script src="martialArtsData.js"></script>
  <script src="battle.js"></script>
</body>
</html>
