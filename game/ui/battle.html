<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>战斗</title>
  <script>
    try {
      if (localStorage.getItem('battle_enter_cinematic') === '1') {
        document.documentElement.style.background = '#000';
      }
    } catch (e) {}
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* 外圈Letterbox用纯色；主视觉在 .battle-container 上叠，避免被整块灰蒙死 */
      background-color: #141018;
    }
    
    .battle-container {
      /* 冲刺距离：在画卷留白内互冲，不依赖侧栏宽度 */
      --lunge: clamp(72px, 16vw, 200px);
      width: 100%;
      max-width: min(1240px, calc(100vw - 16px));
      height: 100vh;
      max-height: none;
      /* 不再叠底部渐隐层，避免与立轴底纹形成「一条弧/暗带」；底图由 PNG 自身表现 */
      background-image: url('../assets/images/UI/panel_wuxia_master_bg_only.png');
      background-size: auto min(142%, 118vh);
      background-position: center bottom;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    .battle-header {
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #f4d03f;
      background: rgba(18, 14, 22, 0.28);
      border-bottom: 1px solid rgba(201, 162, 39, 0.35);
      position: relative;
    }
    
    .turn-display {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid #ff9800;
    }
    
    .battle-field {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px 4px;
      /* 不再叠径向蒙层，画卷原图直接作为主战场 */
      background: none;
    }

    /* 收窄并居中：角色落在立轴米色「画心」里，不漂在两侧灰边 */
    .battle-scroll-canvas {
      flex: 1;
      width: clamp(300px, 68vw, 760px);
      max-height: 100%;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: clamp(18px, 5vw, 56px);
      padding: min(4vh, 40px) min(8px, 1.5%) min(5vh, 44px);
      box-sizing: border-box;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .battle-scroll-canvas .team-side {
      pointer-events: auto;
    }
    
    .team-side {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      /* 出手有位移动画，不能用侧栏 overflow 裁切；每列至多 4 人，靠间距与头像尺寸排布 */
      gap: clamp(6px, 1.4vh, 16px);
      overflow: visible;
      padding: 0;
    }
    
    .team-left {
      align-items: flex-start;
    }
    
    .team-right {
      align-items: flex-end;
    }
    
    .character-card {
      width: auto;
      max-width: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.25s ease, filter 0.25s ease;
      position: relative;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    
    .character-card.active {
      transform: scale(1.05);
    }
    
    .character-card.dead {
      opacity: 0.4;
      filter: grayscale(100%);
    }
    
    /* 纯头像：无外框、无圆角装饰、无阴影；仅固定裁切尺寸 + cover */
    .character-avatar-container {
      width: 80px;
      height: 80px;
      border-radius: 0;
      overflow: hidden;
      border: none;
      box-shadow: none;
      outline: none;
      background: transparent;
    }
    
    .character-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      /* 纯头像仍可能有 remove.bg / 出图底缘的「一条硬边」；仅最底一条做透明渐隐，不是外框 */
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 78%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 78%, transparent 100%);
    }

    /* 己方立轴：共用头像须面朝右；由 martialArtsData.js 的 CHARACTER_PORTRAIT_FLIP_H_BY_ID 控制 */
    #teamAlly .character-avatar.character-avatar--flip-h {
      transform: scaleX(-1);
    }

    /* 个别敌人原图留白多：enemies.js 可选 avatarScale，容器 overflow 裁切 */
    .character-avatar.character-avatar--scaled {
      transform: scale(var(--avatar-scale, 1));
      transform-origin: center center;
    }
    #teamAlly .character-avatar.character-avatar--flip-h.character-avatar--scaled {
      transform: scale(var(--avatar-scale, 1)) scaleX(-1);
    }
    
    .character-avatar-emoji {
      width: 100%;
      height: 100%;
      border-radius: 0;
      background: rgba(22, 16, 12, 0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
      color: #d4c4a8;
    }

    .combat-buff-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2px;
      margin: 1px 0 3px;
      max-width: 96px;
      min-height: 0;
    }

    .combat-buff-row--compact {
      gap: 1px;
      max-width: 88px;
    }

    .combat-buff-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      font-size: 9px;
      line-height: 1;
      padding: 1px 3px 1px 2px;
      min-height: 14px;
      border-radius: 3px;
      background: rgba(20, 32, 48, 0.88);
      color: #b3e5fc;
      border: 1px solid rgba(129, 212, 250, 0.45);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
      animation: combatBuffPop 0.35s ease-out;
      cursor: default;
    }

    .combat-buff-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(6px);
      min-width: 128px;
      max-width: min(220px, 72vw);
      padding: 7px 9px 8px;
      background: linear-gradient(165deg, rgba(40, 32, 24, 0.97) 0%, rgba(22, 18, 14, 0.99) 100%);
      color: #e8dcc8;
      border: 1px solid rgba(200, 175, 120, 0.5);
      border-radius: 8px;
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0s linear 0.2s;
      z-index: 280;
      pointer-events: none;
      text-align: left;
    }

    .combat-buff-badge:hover .combat-buff-tooltip,
    .combat-buff-badge:focus .combat-buff-tooltip,
    .combat-buff-badge:focus-within .combat-buff-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      transition-delay: 0s;
    }

    .combat-buff-tooltip__name {
      font-weight: 700;
      font-size: 12px;
      line-height: 1.25;
      color: #ffe082;
      margin-bottom: 3px;
    }

    .combat-buff-tooltip__effect {
      font-size: 11px;
      line-height: 1.4;
      color: #e8dcc8;
      opacity: 0.95;
      word-break: break-word;
      white-space: normal;
    }

    .combat-buff-badge__icon {
      font-size: 9px;
      line-height: 1;
      flex-shrink: 0;
    }

    .combat-buff-badge__text {
      font-weight: 700;
      letter-spacing: -0.03em;
      transform: scale(0.96);
      transform-origin: center;
    }

    .combat-buff-row--compact .combat-buff-badge {
      padding: 1px 2px;
      min-height: 13px;
    }

    .combat-buff-row--compact .combat-buff-badge__text {
      transform: scale(0.92);
    }

    .combat-buff-badge--juechen {
      color: #ffe082;
      border-color: rgba(255, 224, 130, 0.55);
      background: rgba(48, 38, 18, 0.9);
    }

    @keyframes combatBuffPop {
      0% {
        transform: scale(0.85);
        opacity: 0.2;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* 战斗 Buff 头像特效：绝尘 speed_dust — 风线掠影 + 尘粒上飘 */
    .character-avatar-container.has-buff-avatar-fx {
      overflow: visible;
    }

    .combat-buff-avatar-fx {
      position: absolute;
      inset: -10px -14px -6px -14px;
      pointer-events: none;
      z-index: 12;
      overflow: visible;
    }

    /* 绝尘等 Buff 首次出现：约 1s 淡入，风线/尘粒延后渐强 */
    .combat-buff-avatar-fx.is-intro {
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.95s ease-out, transform 0.95s ease-out;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active {
      opacity: 1;
      transform: scale(1);
    }

    .combat-buff-avatar-fx.is-intro .speed-dust-glow {
      animation: none;
      opacity: 0;
      transition: opacity 0.85s ease-out 0.12s;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-glow {
      opacity: 0.7;
      animation: speedDustGlowPulse 1.6s ease-in-out infinite 0.75s;
    }

    .combat-buff-avatar-fx.is-intro .speed-dust-wind,
    .combat-buff-avatar-fx.is-intro .speed-dust-mote {
      animation: none !important;
      opacity: 0;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-wind--a {
      animation: speedDustWindDash 0.95s linear infinite 0.28s;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-wind--b {
      animation: speedDustWindDash 1.05s linear infinite 0.42s;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-wind--c {
      animation: speedDustWindDash 1.12s linear infinite 0.55s;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-mote--1 {
      animation: speedDustMoteRise 1.2s ease-out infinite 0.35s;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-mote--2 {
      animation: speedDustMoteRise 1.1s ease-out infinite 0.48s;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-mote--3 {
      animation: speedDustMoteRise 1.25s ease-out infinite 0.58s;
    }

    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-mote--4,
    .combat-buff-avatar-fx.is-intro.is-intro-active .speed-dust-mote--5 {
      animation: speedDustMoteRise 1.05s ease-out infinite 0.68s;
    }

    .combat-buff-row--intro {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.75s ease-out, transform 0.75s ease-out;
    }

    .combat-buff-row--intro.combat-buff-row--intro-active {
      opacity: 1;
      transform: translateY(0);
    }

    .combat-buff-row--intro .combat-buff-badge {
      animation: none;
    }

    .combat-buff-canvas-fx.is-intro {
      opacity: 0;
      transition: opacity 0.95s ease-out;
    }

    .combat-buff-canvas-fx.is-intro.is-intro-active {
      opacity: 1;
    }

    .character-avatar-container.combat-buff-fx-intro.has-speed-premium-fx .character-avatar,
    .character-avatar-container.combat-buff-fx-intro.has-speed-premium-fx .character-avatar-emoji {
      animation: none;
    }

    .character-avatar-container.combat-buff-fx-intro-active.has-speed-premium-fx .character-avatar,
    .character-avatar-container.combat-buff-fx-intro-active.has-speed-premium-fx .character-avatar-emoji {
      animation: speedAvatarJitter 0.42s ease-in-out infinite;
    }

    .combat-buff-avatar-fx--speed-dust .speed-dust-glow {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 8%;
      height: 38%;
      background: radial-gradient(
        ellipse 80% 70% at 50% 100%,
        rgba(255, 224, 130, 0.42) 0%,
        rgba(255, 193, 80, 0.12) 55%,
        transparent 78%
      );
      filter: blur(2px);
      animation: speedDustGlowPulse 1.6s ease-in-out infinite;
    }

    .speed-dust-wind {
      position: absolute;
      height: 2px;
      opacity: 0;
      border-radius: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(180, 230, 255, 0.15) 18%,
        rgba(255, 248, 220, 0.92) 48%,
        rgba(129, 212, 250, 0.55) 72%,
        transparent 100%
      );
      box-shadow: 0 0 6px rgba(255, 224, 130, 0.45);
      filter: blur(0.4px);
    }

    .speed-dust-wind--a {
      top: 34%;
      width: 88%;
      left: 6%;
      animation: speedDustWindDash 0.72s linear infinite;
    }

    .speed-dust-wind--b {
      top: 52%;
      width: 72%;
      left: 14%;
      animation: speedDustWindDash 0.88s linear infinite 0.22s;
    }

    .speed-dust-wind--c {
      top: 68%;
      width: 64%;
      left: 18%;
      animation: speedDustWindDash 0.95s linear infinite 0.44s;
    }

    .speed-dust-mote {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 236, 179, 0.95);
      box-shadow: 0 0 5px rgba(255, 224, 130, 0.75);
      opacity: 0;
    }

    .speed-dust-mote--1 {
      left: 22%;
      bottom: 18%;
      animation: speedDustMoteRise 1.15s ease-out infinite;
    }

    .speed-dust-mote--2 {
      left: 48%;
      bottom: 12%;
      animation: speedDustMoteRise 1.05s ease-out infinite 0.18s;
    }

    .speed-dust-mote--3 {
      left: 68%;
      bottom: 20%;
      animation: speedDustMoteRise 1.22s ease-out infinite 0.35s;
    }

    .speed-dust-mote--4 {
      left: 36%;
      bottom: 8%;
      width: 3px;
      height: 3px;
      animation: speedDustMoteRise 0.98s ease-out infinite 0.52s;
    }

    .speed-dust-mote--5 {
      left: 58%;
      bottom: 6%;
      width: 3px;
      height: 3px;
      animation: speedDustMoteRise 1.08s ease-out infinite 0.68s;
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='2'] .speed-dust-wind--a {
      animation-duration: 0.58s;
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='2'] .speed-dust-wind--b {
      animation-duration: 0.72s;
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='2'] .speed-dust-mote {
      box-shadow: 0 0 7px rgba(255, 224, 130, 0.9);
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='3'] .speed-dust-wind {
      height: 3px;
      filter: blur(0.2px);
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='3'] .speed-dust-wind--a {
      animation-duration: 0.48s;
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='3'] .speed-dust-wind--b {
      animation-duration: 0.58s;
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='3'] .speed-dust-wind--c {
      animation-duration: 0.62s;
    }

    .combat-buff-avatar-fx--speed-dust[data-stack-tier='3'] .speed-dust-glow {
      animation-duration: 1.1s;
      opacity: 0.95;
    }

    .combat-buff-avatar-fx--speed-dust[data-visual-tier='2'] .speed-dust-wind--d {
      top: 42%;
      width: 80%;
      left: 10%;
      animation: speedDustWindDash 0.8s linear infinite 0.12s;
    }

    .combat-buff-avatar-fx--speed-dust[data-visual-tier='2'] .speed-dust-wind--e {
      top: 76%;
      width: 58%;
      left: 20%;
      animation: speedDustWindDash 0.92s linear infinite 0.38s;
    }

    .combat-buff-avatar-fx--speed-dust[data-visual-tier='2'] .speed-dust-mote--6 {
      left: 28%;
      bottom: 14%;
      animation: speedDustMoteRise 1.1s ease-out infinite 0.25s;
    }

    .combat-buff-avatar-fx--speed-dust[data-visual-tier='2'] .speed-dust-mote--7 {
      left: 54%;
      bottom: 16%;
      animation: speedDustMoteRise 0.95s ease-out infinite 0.42s;
    }

    .combat-buff-avatar-fx--speed-dust[data-visual-tier='2'] .speed-dust-mote--8 {
      left: 72%;
      bottom: 10%;
      animation: speedDustMoteRise 1.18s ease-out infinite 0.58s;
    }

    /* 第三档·高阶/绝阶：Canvas 粒子 + 头像轻抖 + 残影 */
    .combat-buff-canvas-fx {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 108px;
      height: 108px;
      margin-left: -54px;
      margin-top: -54px;
      pointer-events: none;
      z-index: 14;
    }

    .combat-buff-avatar-fx--premium-marker {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 13;
    }

    .character-avatar-container.has-speed-premium-fx .character-avatar,
    .character-avatar-container.has-speed-premium-fx .character-avatar-emoji {
      animation: speedAvatarJitter 0.42s ease-in-out infinite;
    }

    .character-avatar-container.has-speed-premium-fx.is-burst-premium .character-avatar,
    .character-avatar-container.has-speed-premium-fx.is-burst-premium .character-avatar-emoji {
      animation: speedAvatarBurstJitter 0.52s ease-out 1;
    }

    .speed-dust-afterimage {
      position: absolute;
      inset: 0;
      z-index: 10;
      opacity: 0.32;
      pointer-events: none;
      filter: blur(0.6px);
      animation: speedGhostTrail 0.48s ease-in-out infinite;
    }

    @keyframes speedAvatarJitter {
      0%,
      100% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(-3px);
      }
    }

    #teamAlly .character-avatar-container.has-speed-premium-fx .character-avatar.character-avatar--flip-h {
      animation: speedAvatarJitterFlip 0.42s ease-in-out infinite;
    }

    @keyframes speedAvatarJitterFlip {
      0%,
      100% {
        transform: scaleX(-1) translateX(0);
      }
      50% {
        transform: scaleX(-1) translateX(3px);
      }
    }

    @keyframes speedAvatarBurstJitter {
      0% {
        transform: translateX(0);
      }
      30% {
        transform: translateX(-7px);
      }
      100% {
        transform: translateX(0);
      }
    }

    @keyframes speedGhostTrail {
      0%,
      100% {
        opacity: 0.16;
        filter: blur(1px);
      }
      50% {
        opacity: 0.44;
        filter: blur(0.4px);
      }
    }

    .combat-buff-avatar-fx--speed-dust.is-burst .speed-dust-glow {
      animation: speedDustBurstGlow 0.55s ease-out forwards;
    }

    .combat-buff-avatar-fx--speed-dust.is-burst .speed-dust-wind {
      animation-duration: 0.38s !important;
    }

    .speed-dust-gain-pop {
      position: absolute;
      left: 50%;
      top: -6px;
      transform: translateX(-50%) scale(0.85);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffe082;
      text-shadow:
        0 0 8px rgba(255, 193, 7, 0.85),
        0 1px 3px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      white-space: nowrap;
    }

    .speed-dust-gain-pop.show {
      animation: speedDustGainPop 0.88s ease-out forwards;
    }

    .speed-dust-gain-pop--intro.show {
      animation: speedDustGainPopIntro 1.05s ease-out forwards;
    }

    @keyframes speedDustWindDash {
      0% {
        opacity: 0;
        transform: translateX(55%);
      }
      12% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translateX(-115%);
      }
    }

    @keyframes speedDustMoteRise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.4);
      }
      15% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translateY(-52px) scale(0.7);
      }
    }

    @keyframes speedDustGlowPulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scaleX(0.92);
      }
      50% {
        opacity: 0.95;
        transform: scaleX(1.04);
      }
    }

    @keyframes speedDustBurstGlow {
      0% {
        opacity: 0.35;
        transform: scale(0.85);
      }
      35% {
        opacity: 1;
        transform: scale(1.15);
      }
      100% {
        opacity: 0.65;
        transform: scale(1);
      }
    }

    @keyframes speedDustGainPop {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(6px) scale(0.75);
      }
      18% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1.08);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-38px) scale(0.92);
      }
    }

    @keyframes speedDustGainPopIntro {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(10px) scale(0.7);
      }
      28% {
        opacity: 0.85;
        transform: translateX(-50%) translateY(2px) scale(0.98);
      }
      45% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1.04);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-32px) scale(0.96);
      }
    }

    .character-name {
      font-size: 12px;
      font-weight: bold;
      color: #f5eed8;
      text-align: center;
      max-width: 92px;
      line-height: 1.25;
      word-break: break-all;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 8px rgba(0, 0, 0, 0.45);
      margin-bottom: 2px;
    }

    /* 少侠在己方第一位：名字相对头像略偏右时，向左收一点对齐头顶 */
    #teamAlly .character-card:first-child .character-name {
      position: relative;
      left: -8px;
    }
    
    .team-left .character-card.attack-move {
      animation: attackMoveRightOnly 0.3s ease-out forwards;
    }
    
    .team-left .character-card.attack-return {
      animation: attackReturnRight 0.3s ease-in forwards;
    }
    
    .team-right .character-card.attack-move {
      animation: attackMoveLeftOnly 0.3s ease-out forwards;
    }
    
    .team-right .character-card.attack-return {
      animation: attackReturnLeft 0.3s ease-in forwards;
    }
    
    .team-left .character-card.dodging {
      animation: dodgeMoveLeft 0.3s ease-out;
    }
    
    .team-right .character-card.dodging {
      animation: dodgeMoveRight 0.3s ease-out;
    }
    
    @keyframes attackMoveRightOnly {
      0% { transform: translateX(0); }
      100% { transform: translateX(var(--lunge)) scale(1.05); }
    }
    
    @keyframes attackReturnRight {
      0% { transform: translateX(var(--lunge)) scale(1.05); }
      100% { transform: translateX(0); }
    }
    
    @keyframes attackMoveLeftOnly {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-1 * var(--lunge))) scale(1.05); }
    }
    
    @keyframes attackReturnLeft {
      0% { transform: translateX(calc(-1 * var(--lunge))) scale(1.05); }
      100% { transform: translateX(0); }
    }
    
    @keyframes dodgeMoveLeft {
      0% { transform: translateX(0) scale(1); }
      50% { transform: translateX(-30px) scale(0.9); }
      100% { transform: translateX(0) scale(1); }
    }
    
    @keyframes dodgeMoveRight {
      0% { transform: translateX(0) scale(1); }
      50% { transform: translateX(30px) scale(0.9); }
      100% { transform: translateX(0) scale(1); }
    }
    
    .hp-text {
      font-size: 11px;
      color: #e53935;
      text-align: center;
      font-weight: bold;
      text-shadow:
        0 0 2px rgba(0, 0, 0, 0.95),
        0 1px 3px rgba(0, 0, 0, 0.9);
      line-height: 1.2;
    }
    
    .mp-text {
      font-size: 11px;
      color: #90caf9;
      text-align: center;
      font-weight: bold;
      transition: color 0.25s ease, transform 0.25s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      line-height: 1.2;
    }
    
    .skill-bubble {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #333;
      padding: 10px 18px;
      border-radius: 20px 25px 22px 28px;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
      border: 2px solid #333;
    }

    .skill-bubble.skill-bubble--speed-extra {
      border-color: #b8860b;
      background: linear-gradient(180deg, #fffaf0, #ffe4b5);
      color: #3d2914;
      font-size: 16px;
      box-shadow: 2px 2px 0 rgba(139, 90, 0, 0.2);
    }

    /* 战前台词：仅配置了 battleIntro / 上下文覆盖时出现 */
    .battle-intro-bubble {
      position: absolute;
      left: 50%;
      bottom: calc(100% - 2px);
      transform: translateX(-50%) scale(0.94);
      min-width: 200px;
      max-width: min(300px, 78vw);
      padding: 12px 14px 10px;
      background: linear-gradient(165deg, #fffef8 0%, #f5ecd8 55%, #e8dcc4 100%);
      color: #2a2218;
      border-radius: 14px 16px 12px 18px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0;
      pointer-events: none;
      z-index: 240;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.35),
        0 0 0 2px rgba(62, 39, 18, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(90, 60, 30, 0.45);
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    .battle-intro-bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      border-width: 8px 7px 0 7px;
      border-style: solid;
      border-color: #e8dcc4 transparent transparent transparent;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.2));
    }

    .battle-intro-bubble--show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .battle-intro-bubble--shout {
      min-width: 88px;
      max-width: 160px;
      padding: 10px 16px;
      font-size: 22px;
      letter-spacing: 0.2em;
      text-align: center;
      border-radius: 12px;
    }

    .character-card.battle-cue-speaking {
      filter: brightness(1.08);
      z-index: 2;
    }

    .character-card.battle-cue-speaking .character-avatar-container {
      box-shadow: 0 0 12px rgba(255, 224, 130, 0.35);
    }

    .battle-log-line.is-cue {
      color: #ffe082;
      font-style: italic;
    }
    
    /* 直刺特效 - 直线剑气 */
    .sword-effect-thrust {
      position: absolute;
      width: 200px;
      height: 8px;
      background: linear-gradient(90deg, transparent, #ffd700, #ff8c00, transparent);
      border-radius: 4px;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transform-origin: left center;
    }
    
    .sword-effect-thrust.show {
      animation: thrustEffect 0.5s ease-out forwards;
    }
    
    /* 通用轻量剑光（武馆/ plainFx）：短、淡、快，不抢戏 */
    .sword-effect-plain {
      position: absolute;
      width: 140px;
      height: 5px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(220, 235, 255, 0.15) 15%,
        rgba(255, 255, 255, 0.95) 45%,
        rgba(180, 220, 255, 0.85) 55%,
        rgba(120, 180, 255, 0.35) 80%,
        transparent 100%);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(200, 230, 255, 0.65), 0 0 4px rgba(255, 255, 255, 0.9);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transform-origin: center center;
    }
    
    .sword-effect-plain.show {
      animation: plainThrust 0.34s ease-out forwards;
    }
    
    @keyframes plainThrust {
      0% {
        opacity: 0;
        transform: scaleX(0.2);
        filter: blur(1px);
      }
      25% {
        opacity: 1;
        transform: scaleX(1);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: scaleX(1.05);
        filter: blur(0.5px);
      }
    }
    
    @keyframes thrustEffect {
      0% {
        opacity: 0;
        transform: scaleX(0);
      }
      20% {
        opacity: 1;
        transform: scaleX(1);
      }
      100% {
        opacity: 0;
        transform: scaleX(1);
      }
    }
    
    /* 剑影特效 - 竖着的剑气 */
    .sword-effect-shadow {
      position: absolute;
      width: 8px;
      height: 150px;
      background: linear-gradient(180deg, transparent, #8b00ff, #ff00ff, transparent);
      border-radius: 4px;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 20px #8b00ff;
    }
    
    .sword-effect-shadow.show {
      animation: shadowEffect 0.5s ease-out forwards;
    }
    
    @keyframes shadowEffect {
      0% {
        opacity: 0;
        transform: scaleY(0);
      }
      30% {
        opacity: 1;
        transform: scaleY(1);
      }
      100% {
        opacity: 0;
        transform: scaleY(1.5);
      }
    }
    
    /* 受击震动效果 */
    .character-card.hit {
      animation: hitShake 0.32s ease-out;
    }
    
    @keyframes hitShake {
      0%, 100% {
        transform: translateX(0);
      }
      12%, 36%, 60%, 84% {
        transform: translateX(-10px);
      }
      24%, 48%, 72% {
        transform: translateX(10px);
      }
    }

    /* 拳落点：略大位移 + 轻倾角，仍偏朴素 */
    .character-card.hit.hit-strong {
      animation: hitShakeStrong 0.36s ease-out;
    }

    @keyframes hitShakeStrong {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      14%, 42%, 70% {
        transform: translate(-14px, 2px) rotate(-2deg);
      }
      28%, 56%, 84% {
        transform: translate(14px, -2px) rotate(2deg);
      }
    }

    /* 拳命中时极轻整屏一颤 */
    .battle-container.screen-jolt {
      animation: screenJolt 0.2s ease-out;
    }

    @keyframes screenJolt {
      0%, 100% {
        transform: translate(0, 0);
      }
      35% {
        transform: translate(-4px, 3px);
      }
      70% {
        transform: translate(3px, -2px);
      }
    }

    /* 刀招 bladeFx：冷青刃风 + 细刃脊 + 掠锋短闪（非拳类放射爆） */
    .blade-cut-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 22;
      overflow: hidden;
    }

    .blade-cut-wind {
      position: absolute;
      left: -45%;
      top: 32%;
      width: 190%;
      height: 48%;
      opacity: 0;
      background: radial-gradient(
        ellipse 72% 48% at 48% 50%,
        rgba(210, 222, 240, 0.5) 0%,
        rgba(130, 150, 175, 0.22) 42%,
        transparent 68%
      );
      transform: rotate(-32deg) translate(-58%, 0) scale(0.55);
      transform-origin: center center;
      filter: blur(2.2px);
    }

    .blade-cut-spine {
      position: absolute;
      left: -38%;
      top: 40%;
      width: 176%;
      height: 3px;
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent 4%,
        rgba(18, 26, 36, 0.88) 38%,
        rgba(248, 250, 255, 0.98) 50%,
        rgba(18, 26, 36, 0.88) 62%,
        transparent 96%
      );
      box-shadow:
        0 0 10px rgba(200, 215, 235, 0.55),
        0 0 3px rgba(255, 255, 255, 0.45);
      transform: rotate(-32deg) translate(-100%, 0);
      transform-origin: center center;
      border-radius: 1px;
    }

    .blade-cut-glint {
      position: absolute;
      left: -20%;
      top: 41%;
      width: 55%;
      height: 5px;
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.75) 45%,
        rgba(200, 220, 245, 0.35) 70%,
        transparent
      );
      transform: rotate(-32deg) translate(-130%, 0);
      transform-origin: center center;
      filter: blur(0.6px);
    }

    .blade-cut-layer.show .blade-cut-wind {
      animation: bladeWindSweep 0.42s ease-out forwards;
    }

    .blade-cut-layer.show .blade-cut-spine {
      animation: bladeSpineSweep 0.34s cubic-bezier(0.2, 0.85, 0.35, 1) forwards;
    }

    .blade-cut-layer.show .blade-cut-glint {
      animation: bladeGlintSweep 0.3s ease-out 0.05s forwards;
    }

    @keyframes bladeWindSweep {
      0% {
        opacity: 0;
        transform: rotate(-32deg) translate(-70%, 0) scale(0.5);
      }
      22% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(-32deg) translate(72%, 0) scale(1.05);
      }
    }

    @keyframes bladeSpineSweep {
      0% {
        opacity: 0;
        transform: rotate(-32deg) translate(-115%, 0);
      }
      12% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(-32deg) translate(115%, 0);
      }
    }

    @keyframes bladeGlintSweep {
      0% {
        opacity: 0;
        transform: rotate(-32deg) translate(-100%, 0);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(-32deg) translate(95%, 0);
      }
    }

    /* 斧招 axeFx：赭铁宽楔 + 短沉弧（比刀脊更钝、更暖、落点更重） */
    .axe-chop-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 23;
      overflow: hidden;
    }

    .axe-chop-dust {
      position: absolute;
      left: -30%;
      top: 38%;
      width: 160%;
      height: 55%;
      opacity: 0;
      background: radial-gradient(
        ellipse 68% 52% at 52% 58%,
        rgba(180, 120, 70, 0.42) 0%,
        rgba(90, 58, 38, 0.28) 38%,
        transparent 72%
      );
      transform: rotate(-48deg) translate(-52%, 8%) scale(0.6);
      transform-origin: center center;
      filter: blur(3px);
    }

    .axe-chop-wedge {
      position: absolute;
      left: -42%;
      top: 28%;
      width: 88%;
      height: 38%;
      opacity: 0;
      background: linear-gradient(
        135deg,
        transparent 8%,
        rgba(55, 38, 28, 0.92) 28%,
        rgba(210, 165, 110, 0.88) 48%,
        rgba(240, 210, 160, 0.95) 52%,
        rgba(120, 82, 52, 0.85) 68%,
        transparent 92%
      );
      clip-path: polygon(12% 18%, 88% 8%, 72% 92%, 4% 78%);
      transform: rotate(-48deg) translate(-95%, 0);
      transform-origin: center center;
      filter: drop-shadow(0 0 6px rgba(180, 110, 60, 0.45));
    }

    .axe-chop-arc {
      position: absolute;
      left: -36%;
      top: 44%;
      width: 150%;
      height: 5px;
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent 2%,
        rgba(48, 32, 24, 0.9) 32%,
        rgba(255, 210, 150, 0.92) 50%,
        rgba(48, 32, 24, 0.88) 68%,
        transparent 98%
      );
      box-shadow:
        0 0 12px rgba(200, 130, 70, 0.55),
        0 2px 4px rgba(40, 26, 18, 0.35);
      transform: rotate(-48deg) translate(-108%, 0);
      transform-origin: center center;
      border-radius: 2px;
    }

    .axe-chop-spark {
      position: absolute;
      left: 38%;
      top: 46%;
      width: 28%;
      height: 28%;
      opacity: 0;
      background: radial-gradient(
        circle,
        rgba(255, 230, 180, 0.95) 0%,
        rgba(255, 150, 70, 0.45) 42%,
        transparent 72%
      );
      transform: scale(0.35);
      mix-blend-mode: screen;
    }

    .axe-chop-layer.show .axe-chop-dust {
      animation: axeDustBurst 0.48s ease-out forwards;
    }

    .axe-chop-layer.show .axe-chop-wedge {
      animation: axeWedgeChop 0.38s cubic-bezier(0.25, 0.9, 0.35, 1) forwards;
    }

    .axe-chop-layer.show .axe-chop-arc {
      animation: axeArcChop 0.36s cubic-bezier(0.22, 0.88, 0.38, 1) forwards;
    }

    .axe-chop-layer.show .axe-chop-spark {
      animation: axeSparkPop 0.32s ease-out 0.14s forwards;
    }

    @keyframes axeDustBurst {
      0% {
        opacity: 0;
        transform: rotate(-48deg) translate(-62%, 8%) scale(0.5);
      }
      28% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(-48deg) translate(58%, 12%) scale(1.08);
      }
    }

    @keyframes axeWedgeChop {
      0% {
        opacity: 0;
        transform: rotate(-48deg) translate(-110%, -6%);
      }
      16% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(-48deg) translate(42%, 4%);
      }
    }

    @keyframes axeArcChop {
      0% {
        opacity: 0;
        transform: rotate(-48deg) translate(-118%, 0);
      }
      14% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: rotate(-48deg) translate(88%, 0);
      }
    }

    @keyframes axeSparkPop {
      0% {
        opacity: 0;
        transform: scale(0.2);
      }
      35% {
        opacity: 1;
        transform: scale(1.05);
      }
      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    .battle-container.screen-jolt-axe {
      animation: screenJoltAxe 0.28s ease-out;
    }

    @keyframes screenJoltAxe {
      0%, 100% {
        transform: translate(0, 0);
      }
      30% {
        transform: translate(-6px, 4px);
      }
      65% {
        transform: translate(5px, -3px);
      }
    }

    /* 朴素拳击命中：中心亮斑 + 放射短劲线 */
    .punch-impact-root {
      position: absolute;
      z-index: 55;
      pointer-events: none;
      width: 0;
      height: 0;
    }

    .punch-impact-core {
      position: absolute;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.98) 0%,
        rgba(255, 210, 160, 0.55) 42%,
        rgba(255, 130, 70, 0.22) 68%,
        transparent 78%
      );
      opacity: 0;
      transform: scale(0.45);
      mix-blend-mode: screen;
    }

    .punch-impact-root.show .punch-impact-core {
      animation: punchCorePop 0.34s ease-out forwards;
    }

    @keyframes punchCorePop {
      0% {
        opacity: 0;
        transform: scale(0.35);
      }
      38% {
        opacity: 1;
        transform: scale(1.08);
      }
      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    .punch-impact-ray {
      position: absolute;
      left: 0;
      top: 0;
      width: 5px;
      height: 56px;
      margin-left: -2.5px;
      margin-top: -56px;
      transform-origin: 50% 100%;
      transform: rotate(var(--punch-ray-rot, 0deg)) scaleY(0.08);
      border-radius: 3px;
      background: linear-gradient(
        to top,
        rgba(35, 25, 18, 0) 0%,
        rgba(255, 175, 95, 0.92) 32%,
        rgba(255, 255, 255, 1) 52%,
        rgba(255, 215, 160, 0.28) 100%
      );
      opacity: 0;
    }

    .punch-impact-root.show .punch-impact-ray {
      animation: punchRayStrike 0.32s ease-out forwards;
    }

    @keyframes punchRayStrike {
      0% {
        opacity: 0;
        transform: rotate(var(--punch-ray-rot, 0deg)) scaleY(0.06);
      }
      24% {
        opacity: 1;
        transform: rotate(var(--punch-ray-rot, 0deg)) scaleY(1);
      }
      100% {
        opacity: 0;
        transform: rotate(var(--punch-ray-rot, 0deg)) scaleY(0.75);
      }
    }
    
    .hit-impact-overlay {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 20;
      background: radial-gradient(
        ellipse 85% 75% at 50% 42%,
        rgba(255, 255, 255, 0.88) 0%,
        rgba(255, 220, 180, 0.45) 35%,
        rgba(255, 80, 40, 0.2) 55%,
        transparent 72%
      );
      mix-blend-mode: screen;
      animation: hitImpactPop 0.26s ease-out forwards;
    }
    
    @keyframes hitImpactPop {
      0% {
        opacity: 0;
        transform: scale(0.88);
      }
      40% {
        opacity: 1;
        transform: scale(1.02);
      }
      100% {
        opacity: 0;
        transform: scale(1.08);
      }
    }
    
    .hit-impact-overlay.hit-impact-blade {
      background: radial-gradient(
        ellipse 82% 72% at 50% 44%,
        rgba(230, 240, 255, 0.78) 0%,
        rgba(140, 168, 198, 0.32) 42%,
        rgba(35, 48, 68, 0.16) 58%,
        transparent 74%
      );
      mix-blend-mode: lighten;
    }

    .hit-impact-overlay.hit-impact-axe {
      background: radial-gradient(
        ellipse 78% 68% at 50% 48%,
        rgba(255, 220, 170, 0.82) 0%,
        rgba(200, 120, 60, 0.38) 38%,
        rgba(80, 48, 28, 0.22) 56%,
        transparent 76%
      );
      mix-blend-mode: screen;
      animation: hitImpactAxePop 0.32s ease-out forwards;
    }

    @keyframes hitImpactAxePop {
      0% {
        opacity: 0;
        transform: scale(0.82);
      }
      32% {
        opacity: 1;
        transform: scale(1.06);
      }
      100% {
        opacity: 0;
        transform: scale(1.12);
      }
    }

    /** 闪避成功：头像上极轻一闪（弱于受击 hit-impact，避免与真挨打混淆） */
    .dodge-glint-overlay {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 19;
      background: radial-gradient(
        ellipse 72% 68% at 50% 44%,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(210, 235, 255, 0.2) 48%,
        transparent 70%
      );
      mix-blend-mode: soft-light;
      animation: dodgeGlintPop 0.22s ease-out forwards;
    }

    @keyframes dodgeGlintPop {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      38% {
        opacity: 0.9;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.03);
      }
    }
    
    .skill-bubble.show {
      opacity: 1;
      top: -60px;
      animation: bubblePop 0.5s ease-out;
    }
    
    .skill-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 45%;
      transform: translateX(-50%) rotate(15deg);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 14px solid #fff;
    }
    
    .skill-bubble::before {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 45%;
      transform: translateX(-50%) rotate(15deg);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 16px solid #333;
      z-index: -1;
    }
    
    @keyframes bubblePop {
      0% {
        transform: translateX(-50%) scale(0.5) rotate(-3deg);
        opacity: 0;
      }
      50% {
        transform: translateX(-50%) scale(1.1) rotate(2deg);
        opacity: 1;
      }
      100% {
        transform: translateX(-50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    
    .battle-log-panel {
      flex-shrink: 0;
      width: min(96%, 920px);
      margin: 0 auto 8px;
      padding: 0 14px;
      z-index: 5;
      pointer-events: auto;
    }

    .battle-log-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      margin: 0;
      border: 1px solid rgba(201, 162, 39, 0.22);
      border-radius: 4px 4px 0 0;
      background: rgba(14, 11, 18, 0.55);
      color: #e6cf7a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.2em;
      cursor: pointer;
      font-family: inherit;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .battle-log-toggle:hover {
      background: rgba(22, 18, 28, 0.85);
      color: #f5e6a8;
    }

    .battle-log-toggle:focus-visible {
      outline: 2px solid rgba(201, 162, 39, 0.65);
      outline-offset: 2px;
    }

    .battle-log-toggle-icon {
      flex-shrink: 0;
      font-size: 10px;
      letter-spacing: 0;
      opacity: 0.9;
      transition: transform 0.3s ease;
    }

    .battle-log-panel.collapsed .battle-log-toggle-icon {
      transform: rotate(-90deg);
    }

    .battle-log-panel.collapsed .battle-log-toggle {
      border-radius: 4px;
    }

    .battle-log-entries-wrap {
      overflow: hidden;
      /* 固定高度；略矮，把纵向空间留给多角色列 */
      height: min(13vh, 120px);
      max-height: min(13vh, 120px);
      opacity: 1;
      transition: max-height 0.45s ease, height 0.45s ease, opacity 0.3s ease;
      border: 1px solid rgba(201, 162, 39, 0.18);
      border-top: none;
      border-radius: 0 0 4px 4px;
      background: rgba(10, 8, 12, 0.42);
    }

    .battle-log-panel.collapsed .battle-log-entries-wrap {
      height: 0;
      max-height: 0;
      opacity: 0;
      border-width: 0;
      pointer-events: none;
    }

    .battle-log-entries {
      height: 100%;
      max-height: none;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 8px 8px;
      font-size: 12px;
      line-height: 1.45;
      color: #e8dcc8;
      text-align: left;
      scrollbar-width: thin;
      scrollbar-color: rgba(201, 162, 39, 0.45) rgba(0, 0, 0, 0.2);
    }

    .battle-log-entries::-webkit-scrollbar {
      width: 6px;
    }

    .battle-log-entries::-webkit-scrollbar-thumb {
      background: rgba(201, 162, 39, 0.4);
      border-radius: 4px;
    }

    .battle-log-line {
      margin-bottom: 5px;
      word-break: break-word;
    }

    .battle-log-line:last-child {
      margin-bottom: 0;
    }

    .battle-log-line.is-round {
      color: #f0d78c;
      font-weight: bold;
      text-align: center;
      letter-spacing: 0.06em;
      margin: 8px 0;
    }

    .battle-log-line.is-speed-extra {
      color: #c9a227;
      font-style: italic;
    }

    .battle-log-empty {
      color: rgba(232, 220, 200, 0.45);
      font-size: 12px;
      text-align: center;
      padding: 12px 0;
    }
    
    .damage-number {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      color: #ff5722;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 9999;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    
    .damage-number.critical {
      font-size: 30px;
      color: #ffeb3b;
    }
    
    .damage-number.miss {
      color: #9e9e9e;
    }
    
    .damage-number.parry {
      color: #2196f3;
    }
    
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-60px);
      }
    }
    
    .reward-text {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      color: #4caf50;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      opacity: 0;
      z-index: 200;
    }
    
    .reward-text.show {
      animation: rewardFloat 2s ease-out forwards;
    }
    
    @keyframes rewardFloat {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.8);
      }
      15% {
        opacity: 1;
        transform: translateY(0) scale(1.1);
      }
      25% {
        transform: translateY(0) scale(1);
      }
      75% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-40px);
      }
    }
    
    .victory-text {
      color: #ffeb3b;
    }
    
    /* 底部控件区：尽量不接一条明显分界；需略托底时用极淡平色 */
    .battle-bottom-deck {
      flex-shrink: 0;
      position: relative;
      z-index: 6;
      padding-top: 6px;
      background: rgba(8, 6, 12, 0.22);
      border-top: 1px solid rgba(201, 162, 39, 0.08);
      box-shadow: none;
    }

    /* 当前行动者气血/内力条（背景图里红蓝条仅为装饰，此处为真实数值） */
    .battle-actor-bars {
      flex-shrink: 0;
      padding: 6px 20px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .actor-bars-title {
      font-size: 13px;
      color: #e8dcc8;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* 顶边不做大圆角，减轻立轴下方「一条弧/药丸边」与战场底缘抢视线 */
    .actor-bars-panel {
      width: 100%;
      max-width: min(380px, 92vw);
      padding: 10px 14px 12px;
      border-radius: 0;
      background: rgba(12, 8, 16, 0.72);
      border: 1px solid rgba(201, 162, 39, 0.4);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .bar-row:first-of-type {
      margin-top: 0;
    }

    .bar-label {
      flex: 0 0 2em;
      font-size: 12px;
      color: #c9a8a0;
    }

    .bar-track {
      flex: 1;
      height: 11px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 5px;
      transition: width 0.35s ease;
    }

    .bar-fill.hp-fill {
      background: linear-gradient(180deg, #ff8a80 0%, #c62828 45%, #8e0000 100%);
      box-shadow: 0 0 8px rgba(198, 40, 40, 0.5);
    }

    .bar-fill.mp-fill {
      background: linear-gradient(180deg, #82b1ff 0%, #1565c0 50%, #0d47a1 100%);
      box-shadow: 0 0 8px rgba(21, 101, 192, 0.45);
    }

    .bar-nums {
      flex: 0 0 auto;
      font-size: 11px;
      color: #d4c4a8;
      font-variant-numeric: tabular-nums;
      min-width: 7.5em;
      text-align: right;
    }

    .battle-footer {
      padding: 8px 20px 20px;
      border-top: none;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    
    .battle-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-auto {
      background: linear-gradient(135deg, #4caf50, #388e3c);
      color: #fff;
    }
    
    .btn-auto:hover {
      transform: scale(1.05);
    }
    
    .settle-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 30px;
    }
    
    .settle-panel.show {
      display: flex;
    }
    
    .settle-title {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    
    .settle-title.victory {
      color: #4caf50;
    }
    
    .settle-title.defeat {
      color: #f44336;
    }
    
    .settle-content {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }
    
    .settle-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #333;
      font-size: 18px;
    }
    
    .settle-item:last-child {
      border-bottom: none;
    }
    
    .settle-label {
      color: #aaa;
    }
    
    .settle-value {
      color: #ff9800;
      font-weight: bold;
    }
    
    .btn-exit {
      margin-top: 30px;
      padding: 15px 50px;
      font-size: 20px;
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .btn-exit:hover {
      transform: scale(1.05);
    }

    @media (max-width: 520px) {
      .battle-container {
        --lunge: clamp(56px, 20vw, 140px);
      }

      .battle-scroll-canvas {
        width: clamp(260px, 88vw, 520px);
        gap: min(4vw, 22px);
        padding: min(3vh, 28px) min(4%, 12px) min(4vh, 40px);
      }

      .team-side {
        gap: clamp(5px, 1.2vh, 12px);
      }

      .character-avatar-container {
        width: 68px;
        height: 68px;
      }

      .character-avatar-emoji {
        font-size: 28px;
      }

      .character-name {
        font-size: 11px;
        max-width: 76px;
      }

      #teamAlly .character-card:first-child .character-name {
        left: -7px;
      }

      .battle-log-entries-wrap {
        height: min(11vh, 100px);
        max-height: min(11vh, 100px);
      }

      .battle-log-entries {
        height: 100%;
        max-height: none;
        min-height: 0;
        font-size: 11px;
        padding: 5px 6px 6px;
      }

      .battle-log-toggle {
        font-size: 12px;
        letter-spacing: 0.12em;
        padding: 7px 10px;
      }
    }
  </style>
</head>
<body>
  <script>
    try {
      if (localStorage.getItem('battle_enter_cinematic') === '1') {
        document.documentElement.style.background = '#000';
        if (document.body) document.body.style.background = '#000';
        if (!document.getElementById('battlePageCinematicBlack')) {
          var __bpre = document.createElement('div');
          __bpre.id = 'battlePageCinematicBlack';
          __bpre.setAttribute('aria-hidden', 'true');
          __bpre.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:#000;opacity:1;pointer-events:none;';
          document.body.appendChild(__bpre);
        }
      }
    } catch (e) {}
  </script>
  <div class="battle-container">
    <div class="battle-header">
      ⚔️ 战斗中
      <div class="turn-display" id="turnDisplay">第 1/99 回合</div>
    </div>
    
    <div class="battle-field">
      <div class="battle-scroll-canvas">
        <div class="team-side team-left" id="teamAlly">
        </div>
        <div class="team-side team-right" id="teamEnemy">
        </div>
      </div>
    </div>

    <div class="battle-log-panel" id="battleLogPanel" aria-label="战斗日志">
      <button type="button" class="battle-log-toggle" id="battleLogToggle" aria-expanded="true" aria-controls="battleLogEntriesWrap">
        <span>战况实录</span>
        <span class="battle-log-toggle-icon" aria-hidden="true">▼</span>
      </button>
      <div class="battle-log-entries-wrap" id="battleLogEntriesWrap">
        <div class="battle-log-entries" id="battleLogEntries"></div>
      </div>
    </div>

    <div class="battle-bottom-deck">
      <div class="battle-actor-bars" id="actorBarsHud" aria-label="当前行动者气血内力">
        <div class="actor-bars-title" id="actorBarsTitle">—</div>
        <div class="actor-bars-panel">
          <div class="bar-row">
            <span class="bar-label">气血</span>
            <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="actorBarsTitle" id="actorBarHpTrack">
              <div class="bar-fill hp-fill" id="actorBarHpFill"></div>
            </div>
            <span class="bar-nums" id="actorBarHpNums">— / —</span>
          </div>
          <div class="bar-row" id="actorBarMpRow" style="display: none;">
            <span class="bar-label">内力</span>
            <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="actorBarMpTrack">
              <div class="bar-fill mp-fill" id="actorBarMpFill"></div>
            </div>
            <span class="bar-nums" id="actorBarMpNums">— / —</span>
          </div>
        </div>
      </div>

      <div class="battle-footer">
        <button class="battle-btn btn-auto" id="btnAuto">自动战斗</button>
      </div>
    </div>
    
    <div class="settle-panel" id="settlePanel">
      <div class="settle-title" id="settleTitle">胜利</div>
      <div class="settle-content" id="settleContent">
      </div>
      <button class="btn-exit" id="btnExit">离开战斗</button>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils/battleEntry.js"></script>
  <script src="../js/utils/battleSettlement.js"></script>
  <script src="../js/utils/statCalculator.js"></script>
  <script src="../js/utils/BattleHitRoll.js"></script>
  <script src="../js/utils/battleNarrative.js"></script>
  <script src="../js/utils/effects.js"></script>
  <script src="../js/utils/combatBuffCanvasFx.js"></script>
  <script src="../js/utils/attributeHelper.js"></script>
  <script src="../js/data/battlePassives.js"></script>
  <script src="character.js"></script>
  <script src="../js/data/enemies.js"></script>
  <script src="../js/data/battleBuffs.js"></script>
  <script src="../js/data/martialSkillDamage.js"></script>
  <script src="martialArtsData.js"></script>
  <script src="battle.js"></script>
</body>
</html>
